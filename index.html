<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A5AF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="העוזרת">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>העוזרת של חננאל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F6; --bg2:#ECECF0; --card:#FFFFFF; --ink:#0B0B0F; --ink2:#2B2B33; --muted:#73737D; --line:rgba(15,15,25,.07); --soft:#F1F1F4;
  --accent:#6A5AF9; --accent2:#9D7BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(106,90,249,.10);
  --grad:linear-gradient(135deg,#6A5AF9 0%,#8B6CFF 55%,#C17BFF 100%);
  --green:#12A26B; --green-soft:rgba(18,162,107,.11);
  --warn:#D97706; --warn-soft:rgba(217,119,6,.11); --danger:#E5484D; --danger-soft:rgba(229,72,77,.10);
  --blue:#2F6FED; --blue-soft:rgba(47,111,237,.10); --violet:#8E4EC6; --violet-soft:rgba(142,78,198,.11);
  --r:22px; --shadow:0 1px 1px rgba(0,0,0,.02),0 2px 6px rgba(20,20,40,.04),0 12px 32px -12px rgba(20,20,40,.10);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.6);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090B; --bg2:#111114; --card:#141417; --ink:#F4F4F6; --ink2:#D9D9DE; --muted:#8C8C96; --line:rgba(255,255,255,.07); --soft:#1C1C21;
  --accent:#8B7CFF; --accent2:#A98BFF; --accent-soft:rgba(139,124,255,.14);
  --green:#3DD68C; --green-soft:rgba(61,214,140,.12); --warn:#F5A524; --warn-soft:rgba(245,165,36,.12);
  --danger:#FF6369; --danger-soft:rgba(255,99,105,.12); --blue:#6EA0FF; --blue-soft:rgba(110,160,255,.13); --violet:#C08CFF; --violet-soft:rgba(192,140,255,.13);
  --shadow:0 0 0 1px rgba(255,255,255,.05); --glass:rgba(22,22,26,.72); --glass-line:rgba(255,255,255,.07);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body{display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:-20% -20% auto -20%;height:420px;background:radial-gradient(60% 60% at 70% 30%,rgba(124,100,255,.16),transparent 70%),radial-gradient(40% 50% at 15% 10%,rgba(193,123,255,.12),transparent 70%);pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;transition:transform .12s ease,background .2s,opacity .2s}
button:active{transform:scale(.97)}
#app{width:100%;max-width:720px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;z-index:1}
header{padding:calc(16px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.15}
header .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hbtns{display:flex;gap:8px;padding-top:2px}
.iconbtn{background:var(--card);border:0;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);box-shadow:var(--shadow)}
main{flex:1;overflow-y:auto;padding:6px 16px 120px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
main.chatmode{padding-bottom:190px}
main>*{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.03s}main>*:nth-child(3){animation-delay:.06s}main>*:nth-child(4){animation-delay:.09s}main>*:nth-child(5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* floating glass nav */
nav{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:center;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--glass-line);border-radius:26px;padding:6px;z-index:6;box-shadow:0 10px 40px -10px rgba(20,20,40,.25)}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:18px;font-weight:500}
nav button.on{color:var(--ink);font-weight:700}
nav button.on svg{stroke-width:2.2}
nav button.orb{flex:0 0 auto;width:56px;height:56px;margin:-22px 6px 0;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -6px rgba(106,90,249,.6),inset 0 1px 0 rgba(255,255,255,.35)}
nav button.orb.on{box-shadow:0 0 0 4px var(--accent-soft),0 10px 24px -6px rgba(106,90,249,.6)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.01em}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--muted)}
.stat.money b{font-size:19px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type,.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 10px}
.tap{cursor:pointer}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:12px}
.av.lg{width:56px;height:56px;border-radius:19px;font-size:21px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-lead{background:var(--blue-soft);color:var(--blue)} .p-talking{background:var(--violet-soft);color:var(--violet)}
.p-quote{background:var(--warn-soft);color:var(--warn)} .p-active{background:var(--green-soft);color:var(--green)}
.p-done{background:var(--soft);color:var(--muted)} .p-lost{background:var(--danger-soft);color:var(--danger)}
.p-pending{background:var(--warn-soft);color:var(--warn)} .p-paid{background:var(--green-soft);color:var(--green)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.chip i{font-style:normal;opacity:.55;margin-right:3px}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:11px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{width:24px;height:24px;border-radius:8px;border:1.8px solid rgba(120,120,135,.35);background:none;display:grid;place-items:center;flex:none;padding:0;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff;animation:pop .25s}
@keyframes pop{50%{transform:scale(1.18)}}
.timer{border:0;background:var(--soft);border-radius:99px;height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.timer.run{background:var(--danger-soft);color:var(--danger);font-weight:700}
.timer.run svg{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:16px 4px 8px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.grp.red{color:var(--danger)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px -8px rgba(106,90,249,.7)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:absolute;left:20px;bottom:calc(98px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 12px 28px -8px rgba(0,0,0,.45);z-index:5}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:26px;padding:18px;margin-bottom:12px;box-shadow:0 18px 40px -16px rgba(106,90,249,.65)}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;left:-60px}
.hero .top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.hero h2{margin:0;font-size:17px;font-weight:700}
.hero p{margin:3px 0 0;font-size:13px;opacity:.85}
.hero .go{position:relative;z-index:1;margin-top:14px;width:100%;border:0;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;display:flex;align-items:center;gap:10px;backdrop-filter:blur(6px)}
.hero .go span{flex:1;text-align:right}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .5s}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:42%;max-width:15px;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px}
.bars .pair i.e{background:var(--warn);opacity:.75}
.bars .col span{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--accent);margin-left:5px}
.legend i.e{background:var(--warn)}
.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amount.neg{color:var(--warn)}
.timecol{width:50px;text-align:center;flex:none}
.timecol b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.timecol span{font-size:11px;color:var(--muted)}
.evline{width:3px;align-self:stretch;border-radius:3px;background:var(--grad);flex:none}
/* board */
.board{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.lane{flex:0 0 78%;max-width:280px;scroll-snap-align:start;background:var(--bg2);border-radius:20px;padding:10px}
.lane h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.lane h4 small{color:var(--muted);font-weight:500}
.kcard{background:var(--card);border-radius:16px;padding:11px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.kcard .t{font-weight:600;font-size:14px}
.kcard .m{font-size:12px;color:var(--muted)}
/* skeleton */
.sk{height:72px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,var(--card) 25%,var(--soft) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
/* chat */
.msgs{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;line-height:1.55;font-size:15px;word-wrap:break-word;animation:rise .3s both}
.msg.u{align-self:flex-start;background:var(--ink);color:var(--bg);border-bottom-right-radius:7px}
.msg.a{align-self:flex-end;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:7px}
.amsg{align-self:flex-end;display:flex;gap:8px;align-items:flex-end;max-width:92%}
.amsg .msg{max-width:none}
.aorb{width:28px;height:28px;border-radius:10px;background:var(--grad);flex:none;display:grid;place-items:center;color:#fff}
.msg ul{margin:4px 0;padding-right:18px} .msg li{margin:2px 0} .msg p{margin:0 0 6px} .msg p:last-child{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.acts span{font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:9px;font-weight:600}
.typing{display:inline-flex;gap:4px;padding:4px 0} .typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.welcome{text-align:center;padding:30px 6px 8px}
.bigorb{width:84px;height:84px;border-radius:30px;background:var(--grad);margin:0 auto 14px;display:grid;place-items:center;color:#fff;box-shadow:0 20px 40px -12px rgba(106,90,249,.7);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.welcome h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.sugg button{background:var(--card);border:0;border-radius:18px;padding:13px;text-align:right;font-size:13.5px;box-shadow:var(--shadow);line-height:1.4;display:flex;flex-direction:column;gap:6px}
.sugg button b{font-size:18px}
#composer{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom));left:0;right:0;padding:10px 12px;z-index:5;display:none}
#composer.show{display:block}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--glass-line);border-radius:24px;padding:6px;box-shadow:0 10px 30px -10px rgba(20,20,40,.25)}
.cbox textarea{flex:1;border:0;background:none;resize:none;outline:none;padding:9px 8px;max-height:140px;min-height:22px;line-height:1.4;font-size:16px}
.cbtn{width:40px;height:40px;border-radius:15px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.cbtn.send{background:var(--grad);color:#fff}
.cbtn.send:disabled{opacity:.3}
.cbtn.rec{background:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--danger-soft)}}
.partial{font-size:13px;color:var(--muted);padding:2px 12px 6px}
.thumb{display:flex;align-items:center;gap:8px;padding:2px 6px 6px;font-size:12.5px;color:var(--muted)}
.thumb img{width:46px;height:46px;object-fit:cover;border-radius:12px}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(5,5,12,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:720px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));transition:transform .38s cubic-bezier(.16,1,.3,1);z-index:21;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
#sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(120,120,135,.3);margin:6px auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea,.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:500}
.note{background:var(--card);border-radius:16px;padding:11px 13px;margin-bottom:8px;font-size:14px;box-shadow:var(--shadow)}
.note small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.stage{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stage:first-child{border-top:0}
.stage .k{font-size:16px;width:22px;text-align:center}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}
.banner.err{background:var(--danger-soft);color:var(--danger)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.qa a,.qa button{border:0;background:var(--soft);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink);text-decoration:none}
.qa .ico{width:34px;height:34px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.qa .wa .ico{background:#25D366;color:#fff}
.chead{display:flex;align-items:center;gap:14px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;font-size:14px;z-index:40;transition:transform .35s cubic-bezier(.16,1,.3,1);max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500}
.toast.show{transform:translate(-50%,0)}
.sres .row{padding:10px 2px}
.kind{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:7px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1 id="title">היום</h1><div class="sub" id="subtitle"></div></div>
    <div class="hbtns"><button class="iconbtn" data-act="search" aria-label="חיפוש" id="srch"></button><button class="iconbtn" data-act="settings" aria-label="הגדרות" id="gear"></button></div>
  </header>
  <main id="main"></main>
  <div id="composer">
    <div class="cbox">
      <div style="flex:1;display:flex;flex-direction:column">
        <div class="thumb" id="thumb" hidden></div>
        <div class="partial" id="partial" hidden></div>

const projMinutes=pid=>S.tasks.filter(t=>t.projectId===pid).reduce((a,t)=>a+taskMinutes(t),0)+((find('projects',pid)||{}).extraMinutes||0);
function projectTotal(p){if(!p)return 0;if(p.pricing==='hourly')return (p.rate||0)*projMinutes(p.id)/60;return Number(p.price)||0}
const projPaid=pid=>S.payments.filter(x=>x.projectId===pid&&x.status==='paid').reduce((a,x)=>a+(+x.amount||0),0);
const projBilled=pid=>S.payments.filter(x=>x.projectId===pid).reduce((a,x)=>a+(+x.amount||0),0);

/* ============ storage: local + GitHub sync ============ */
const LS='hananel-data-v1',CFG='hananel-cfg',VAPID_PUBLIC='BA7QflWhv1ZhbD_XXZ7vG9voMlILYIijcjXUk5A4MnGd3Z1Fr6jcAhVRHrYJscO_RsQBw10RCp7xORARMi_YAQ8',DATA_REPO_NAME='hananel-data',MODEL='claude-sonnet-5-5';
let cfg={};try{cfg=JSON.parse(localStorage.getItem(CFG)||'{}')}catch(e){}
function saveCfg(){try{localStorage.setItem(CFG,JSON.stringify(cfg))}catch(e){}}
function snapshot(){const o={};COLS.forEach(c=>o[c]=S[c]);o.settings=S.settings;o.chat=S.chat.slice(-60).map(m=>({...m,text:String(m.text).slice(0,4000)}));o.updatedAt=now();return o}
function apply(d){COLS.forEach(c=>S[c]=d[c]||[]);S.settings=d.settings||{};S.chat=d.chat||[];S.dataAt=d.updatedAt||0}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)apply(d)}catch(e){}}
let syncT=null;
function persist(){const d=snapshot();S.dataAt=d.updatedAt;try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}clearTimeout(syncT);syncT=setTimeout(pushRemote,1200);render();refreshSheet()}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+cfg.ghToken,Accept:'application/vnd.github+json',...(opt.headers||{})}});if(r.status===404)return null;if(r.status===401)throw new Error('טוקן GitHub לא תקין');if(!r.ok)throw new Error('GitHub '+r.status);return r.status===204?{}:r.json()}
async function ensureRepo(){if(cfg.dataRepo)return;const u=await gh('/user');cfg.login=u.login;cfg.dataRepo=u.login+'/'+DATA_REPO_NAME;saveCfg();
  const r=await gh('/repos/'+cfg.dataRepo);if(!r)await gh('/user/repos',{method:'POST',body:JSON.stringify({name:DATA_REPO_NAME,private:true,auto_init:true,description:'Data for העוזרת של חננאל'})})}
let remoteSha=null,pushing=false;
async function pullRemote(){if(!cfg.ghToken||!cfg.dataRepo||pushing)return;const f=await gh('/repos/'+cfg.dataRepo+'/contents/data.json');if(!f){remoteSha=null;if(S.dataAt)pushRemote();return}remoteSha=f.sha;
  let d=null;if(f.content)d=JSON.parse(b64d(f.content));else{const raw=await fetch(f.download_url,{headers:{Authorization:'Bearer '+cfg.ghToken}});d=await raw.json()}
  if((d.updatedAt||0)>(S.dataAt||0)&&!S.busy){apply(d);try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}render();refreshSheet()}S.syncErr='';}
async function pushRemote(){if(!cfg.ghToken||!cfg.dataRepo)return;if(pushing){clearTimeout(syncT);syncT=setTimeout(pushRemote,1500);return}pushing=true;
  try{for(let attempt=0;attempt<2;attempt++){const body={message:'sync',content:b64e(JSON.stringify(snapshot()))};if(remoteSha)body.sha=remoteSha;
      const r=await fetch('https://api.github.com/repos/'+cfg.dataRepo+'/contents/data.json',{method:'PUT',headers:{Authorization:'Bearer '+cfg.ghToken,Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
      if(r.ok){remoteSha=(await r.json()).content.sha;S.syncErr='';break}
      if(r.status===409||r.status===422){const f=await gh('/repos/'+cfg.dataRepo+'/contents/data.json');remoteSha=f?f.sha:null;continue}
      throw new Error('GitHub '+r.status)}}
  catch(e){S.syncErr='הסנכרון לענן נכשל — הנתונים שמורים בטלפון וננסה שוב';clearTimeout(syncT);syncT=setTimeout(pushRemote,30000)}
  finally{pushing=false}}
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,7);
async function create(col,data){const id=uid();S[col]=[...S[col],{...JSON.parse(JSON.stringify(data)),id,createdAt:now(),updatedAt:now()}];persist();return id}
async function patch(col,id,data){const clean=JSON.parse(JSON.stringify(data));S[col]=S[col].map(x=>x.id===id?{...x,...clean,updatedAt:now()}:x);persist()}
async function remove(col,id){S[col]=S[col].filter(x=>x.id!==id);persist()}
let ACTLOG=null; const act=t=>{if(ACTLOG)ACTLOG.push(t)};

/* ============ domain actions (UI + assistant) ============ */
async function addClient(f){
  const status=f.status||'lead';
  const id=await create('clients',{name:f.name,phone:f.phone||'',email:f.email||'',company:f.company||'',status,source:f.source||'',value:Number(f.value)||0,notes:f.note?[{text:f.note,at:now()}]:[]});
  act('נוסף '+(status==='lead'?'ליד':'לקוח')+': '+f.name);
  if(status==='lead'&&auto('leadFollowup')){await create('tasks',{title:'לחזור ל'+f.name,due:addDays(today(),1),priority:'today',clientId:id,done:false,auto:true});act('אוטומציה: משימת מעקב ל'+f.name)}
  return id;
}
async function updateClient(id,f){
  const c=find('clients',id);if(!c)throw new Error('לקוח לא נמצא');
  const u={};['name','phone','email','company','status','source'].forEach(k=>{if(f[k]!==undefined&&f[k]!==null)u[k]=f[k]});
  if(f.value!==undefined&&f.value!==null&&f.value!=='')u.value=Number(f.value)||0;
  if(f.add_note)u.notes=[...(c.notes||[]),{text:f.add_note,at:now()}];
  await patch('clients',id,u);
  act(f.add_note&&Object.keys(u).length===1?'הערה נשמרה ל'+c.name:'עודכן: '+c.name+(u.status?' ← '+STATUS_L[u.status]:''));
}
async function addProject(f){
  const stages=(f.stages||[]).map((s,i)=>({id:'s'+now().toString(36)+i,title:s.title,type:s.type||'work',amount:Number(s.amount)||0,due:s.due||'',done:false}));
  const id=await create('projects',{name:f.name,clientId:f.client_id||'',pricing:f.pricing||'fixed',price:Number(f.price)||0,rate:Number(f.rate)||0,hours:Number(f.hours)||0,status:'active',stages,extraMinutes:0,description:f.description||''});
  act('פרויקט חדש: '+f.name);
  if(f.client_id){const c=find('clients',f.client_id);if(c&&['lead','talking','quote'].includes(c.status)){await patch('clients',c.id,{status:'active'});act(c.name+' ← לקוח פעיל')}}
  return id;
}
async function setProjectStatus(id,status){
  const p=find('projects',id);if(!p)throw new Error('פרויקט לא נמצא');
  await patch('projects',id,{status});act('פרויקט '+p.name+' ← '+PSTATUS[status]);
  if(status==='done'&&p.status!=='done'&&auto('projectDone')){
    if(p.pricing!=='retainer'){const remain=Math.round(projectTotal(p)-projBilled(id));
      if(remain>0){await create('payments',{clientId:p.clientId,projectId:id,amount:remain,description:'יתרה לתשלום · '+p.name,status:'pending',due:addDays(today(),7)});act('אוטומציה: בקשת תשלום '+money(remain))}}
    await create('tasks',{title:'לשלוח תודה ולבקש המלצה'+(p.clientId?' מ'+clientName(p.clientId):''),priority:'today',clientId:p.clientId||'',projectId:id,done:false,auto:true});act('אוטומציה: משימת תודה');
  }
}
async function toggleStage(pid,sid,force){
  const p=find('projects',pid);if(!p)throw new Error('פרויקט לא נמצא');
  let st=null;const stages=(p.stages||[]).map(s=>{if(s.id!==sid)return s;st={...s,done:force===undefined?!s.done:!!force};return st});
  if(!st)throw new Error('שלב לא נמצא');
  await patch('projects',pid,{stages});act((st.done?'✓ ':'')+'שלב: '+st.title);
  if(st.done&&st.type==='payment'&&st.amount>0&&auto('paymentStage')){
    await create('payments',{clientId:p.clientId,projectId:pid,amount:st.amount,description:st.title+' · '+p.name,status:'pending',due:today(),stageId:sid});act('אוטומציה: בקשת תשלום '+money(st.amount));
  }
  if(st.done&&(p.stages||[]).length&&stages.every(s=>s.done)&&p.status!=='done'){act('כל השלבים הושלמו')}
}
async function addStage(pid,s){const p=find('projects',pid);if(!p)throw new Error('פרויקט לא נמצא');
  const stage={id:'s'+now().toString(36)+Math.random().toString(36).slice(2,5),title:s.title,type:s.type||'work',amount:Number(s.amount)||0,due:s.due||'',done:false};
  await patch('projects',pid,{stages:[...(p.stages||[]),stage]});act('שלב נוסף: '+s.title);return stage.id}
async function addTask(f){const id=await create('tasks',{title:f.title,due:f.due||'',time:f.time||'',priority:f.priority||(f.due?'':'week'),clientId:f.client_id||'',projectId:f.project_id||'',assignee:f.assignee||'',notes:f.notes||'',done:false,timeLog:[]});act('משימה: '+f.title);return id}
async function updateTask(id,f){const t=find('tasks',id);if(!t)throw new Error('משימה לא נמצאה');
  const u={};['title','due','time','priority','assignee','notes'].forEach(k=>{if(f[k]!==undefined&&f[k]!==null)u[k]=f[k]});
  if(f.client_id!==undefined)u.clientId=f.client_id;if(f.project_id!==undefined)u.projectId=f.project_id;
  if(f.done!==undefined){u.done=!!f.done;u.doneAt=f.done?now():0;if(f.done&&t.running){u.timeLog=[...(t.timeLog||[]),{m:(now()-t.running)/60000,at:now()}];u.running=0}}
  if(f.add_minutes)u.timeLog=[...(u.timeLog||t.timeLog||[]),{m:Number(f.add_minutes),at:now()}];
  await patch('tasks',id,u);act(f.done?'✓ בוצע: '+t.title:'עודכנה משימה: '+t.title)}
async function timer(id,start){const t=find('tasks',id);if(!t)throw new Error('משימה לא נמצאה');
  if(start){for(const o of S.tasks.filter(x=>x.running&&x.id!==id))await timer(o.id,false);if(!t.running){await patch('tasks',id,{running:now()});act('⏱ טיימר: '+t.title)}}
  else if(t.running){const m=(now()-t.running)/60000;await patch('tasks',id,{running:0,timeLog:[...(t.timeLog||[]),{m,at:now()}]});act('⏱ נעצר: '+t.title+' ('+mins(m)+')')}}
async function addEvent(f){let gid='';if(gOk()&&auto('gcalSync')){try{gid=await gcalCreate(f);act('נוסף גם ליומן Google')}catch(e){act('⚠ לא נוסף ליומן Google')}}
  const id=await create('events',{title:f.title,date:f.date,time:f.time||'',endTime:f.end_time||'',clientId:f.client_id||'',location:f.location||'',notes:f.notes||'',gid});act('📅 '+f.title+' · '+fmtDay(f.date)+(f.time?' '+f.time:''));if(gid)setTimeout(refreshGcal,1500);return id}
async function updateEvent(id,f){const e=find('events',id);if(!e)throw new Error('אירוע לא נמצא');const u={};['title','date','time','location','notes'].forEach(k=>{if(f[k]!==undefined)u[k]=f[k]});if(f.end_time!==undefined)u.endTime=f.end_time;if(f.client_id!==undefined)u.clientId=f.client_id;await patch('events',id,u);act('עודכן ביומן: '+(u.title||e.title))}
async function addPayment(f){const id=await create('payments',{clientId:f.client_id||'',projectId:f.project_id||'',amount:Number(f.amount)||0,description:f.description||'',status:'pending',due:f.due||today()});act('בקשת תשלום: '+money(f.amount)+(f.client_id?' · '+clientName(f.client_id):''));return id}
async function markPaid(id,paid=true){const p=find('payments',id);if(!p)throw new Error('תשלום לא נמצא');await patch('payments',id,{status:paid?'paid':'pending',paidAt:paid?now():0});act((paid?'💰 שולם: ':'בוטל תשלום: ')+money(p.amount))}
async function addExpense(f){if(f.gmail_thread_id&&S.expenses.some(e=>e.gmailThreadId===f.gmail_thread_id))return null;
  const id=await create('expenses',{amount:Number(f.amount)||0,supplier:f.supplier||'',category:f.category||'אחר',date:f.date||today(),note:f.note||'',gmailThreadId:f.gmail_thread_id||''});act('הוצאה: '+money(f.amount)+' · '+(f.supplier||''));return id}
async function del(kind,id){const col={client:'clients',project:'projects',task:'tasks',event:'events',payment:'payments',expense:'expenses'}[kind];if(!col||!find(col,id))throw new Error('לא נמצא');await remove(col,id);act('נמחק')}

const gOk=()=>!!(cfg.gToken&&cfg.gExp>now()+60000);
function googleConnect(silent){if(!gClient()){if(!silent)toast('חסר Google Client ID — הדבק אותו בהגדרות');return}
  const u='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:gClient(),redirect_uri:location.origin+location.pathname,response_type:'token',scope:G_SCOPES,include_granted_scopes:'true',state:'g'+now(),...(silent?{prompt:'none'}:{})});
  location.href=u}
function googleCatch(){if(location.hash.includes('error=')&&location.hash.includes('state=g')){history.replaceState(null,'',location.pathname);return}if(!location.hash.includes('access_token'))return;const q=new URLSearchParams(location.hash.slice(1));if((q.get('state')||'')[0]!=='g')return;
  cfg.gToken=q.get('access_token');cfg.gExp=now()+(+q.get('expires_in')||3600)*1000;cfg.gConnected=true;saveCfg();history.replaceState(null,'',location.pathname);setTimeout(()=>toast('Google מחובר ✓'),600)}
async function gapi(url,opt={}){if(!gOk())throw new Error('החיבור לגוגל פג — לחץ "התחבר לגוגל" בהגדרות או בראש המסך');
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+cfg.gToken,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){cfg.gExp=0;saveCfg();render();throw new Error('החיבור לגוגל פג — צריך להתחבר מחדש')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('Google '+r.status+': '+((j.error&&j.error.message)||''));return j}
const ilIso=(date,time)=>{const t=time||'09:00';const off=new Intl.DateTimeFormat('en',{timeZone:TZ,timeZoneName:'longOffset'}).formatToParts(new Date(date+'T12:00:00Z')).find(p=>p.type==='timeZoneName').value.replace('GMT','')||'+00:00';return `${date}T${t}:00${off}`};
async function gcalList(fromDate,toDate){const j=await gapi('https://www.googleapis.com/calendar/v3/calendars/primary/events?'+new URLSearchParams({timeMin:ilIso(fromDate,'00:00'),timeMax:ilIso(toDate,'23:59'),singleEvents:'true',orderBy:'startTime',maxResults:'100'}));
  return (j.items||[]).map(e=>{const s=e.start.dateTime||e.start.date;const en=(e.end&&(e.end.dateTime||e.end.date))||'';return{gid:e.id,title:e.summary||'(ללא כותרת)',date:e.start.dateTime?ymd(new Date(s)):s,time:e.start.dateTime?hm(new Date(s)):'',endTime:e.end&&e.end.dateTime?hm(new Date(en)):'',location:e.location||'',allDay:!e.start.dateTime}})}
async function gcalCreate(f){const start=ilIso(f.date,f.time||'09:00');let endT=f.end_time;if(!endT){const[a,b]=(f.time||'09:00').split(':').map(Number);const m=a*60+b+60;endT=String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
  const body=f.time?{summary:f.title,location:f.location||undefined,description:f.notes||undefined,start:{dateTime:start,timeZone:TZ},end:{dateTime:ilIso(f.date,endT),timeZone:TZ}}:{summary:f.title,start:{date:f.date},end:{date:addDays(f.date,1)}};
  const j=await gapi('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',body:JSON.stringify(body)});return j.id}
async function refreshGcal(){if(!gOk())return;try{const td=today();S.gcal=await gcalList(addDays(td,-1),addDays(td,14));S.gcalAt=now();render()}catch(e){}}
const b64url=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');try{return decodeURIComponent(escape(atob(s)))}catch(e){return atob(s)}};
function mailText(part){if(!part)return'';if(part.mimeType==='text/plain'&&part.body&&part.body.data)return b64url(part.body.data);if(part.parts){for(const p of part.parts){const t=mailText(p);if(t)return t}}if(part.mimeType==='text/html'&&part.body&&part.body.data)return b64url(part.body.data).replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');return''}
const hdr=(m,n)=>((m.payload&&m.payload.headers)||[]).find(x=>x.name.toLowerCase()===n.toLowerCase())?.value||'';
async function gmailSearch(q){const j=await gapi('https://gmail.googleapis.com/gmail/v1/users/me/messages?'+new URLSearchParams({q,maxResults:'15'}));const ids=(j.messages||[]).map(m=>m.id);
  const out=[];for(const id of ids){const m=await gapi(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`);out.push({id,subject:hdr(m,'Subject'),from:hdr(m,'From'),date:hdr(m,'Date'),snippet:(m.snippet||'').slice(0,200)})}return out}
async function gmailRead(id){const m=await gapi(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=full`);const att=[];(function walk(p){if(!p)return;if(p.filename)att.push(p.filename);(p.parts||[]).forEach(walk)})(m.payload);
  return{subject:hdr(m,'Subject'),from:hdr(m,'From'),to:hdr(m,'To'),date:hdr(m,'Date'),body:mailText(m.payload).slice(0,3500),attachments:att.slice(0,6)}}
async function gmailDraft(f){const raw=['To: '+f.to,'Subject: =?UTF-8?B?'+btoa(unescape(encodeURIComponent(f.subject||'')))+'?=','Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',btoa(unescape(encodeURIComponent(f.body||'')))].join('\r\n');
  const enc=btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const j=await gapi('https://gmail.googleapis.com/gmail/v1/users/me/drafts',{method:'POST',body:JSON.stringify({message:{raw:enc}})});return j.id}

function onboarding(){S.sheetLive=false;window._save=async d=>{d.apiKey=(d.apiKey||'').trim();d.ghToken=(d.ghToken||'').trim();if(!d.apiKey.startsWith('sk-ant-'))throw new Error('מפתח Anthropic צריך להתחיל ב-sk-ant-');if(!/^(ghp_|github_pat_)/.test(d.ghToken))throw new Error('טוקן GitHub צריך להתחיל ב-ghp_');cfg.apiKey=d.apiKey.trim();cfg.ghToken=d.ghToken.trim();cfg.googleClientId=(d.googleClientId||'').trim();saveCfg();toast('מתחבר…');await startSync();toast('מוכן ✓ אפשר לדבר עם העוזרת')};

  <form id="frm">${F('apiKey','מפתח Anthropic (מ-platform.claude.com ← API Keys)','text',cfg.apiKey||'','required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore inputmode="text" dir="ltr" placeholder="sk-ant-…"')}${F('googleClientId','Google Client ID (לחיבור Gmail ויומן — לא חובה)','text',cfg.googleClientId||'','autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" dir="ltr" placeholder="….apps.googleusercontent.com"')}${F('ghToken','טוקן GitHub','text',cfg.ghToken||'','required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-1p-ignore inputmode="text" dir="ltr" placeholder="ghp_…"')}<button class="btn primary wide" type="submit">התחל</button></form>`);
  $('#frm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());try{await window._save(d);closeSheet()}catch(err){toast(err.message||'שגיאה')}});}
function urlB64(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast(isStandalone()?'הטלפון לא תומך בהתראות':'התראות עובדות רק מהאייקון במסך הבית');return}
  const p=await Notification.requestPermission();if(p!=='granted'){toast('לא אושרו התראות — אפשר לאשר בהגדרות הטלפון');return}
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(VAPID_PUBLIC)});
  const j=sub.toJSON();const subs=(S.settings.pushSubs||[]).filter(s=>s.endpoint!==j.endpoint);subs.push(j);await saveSettings({pushSubs:subs});
  reg.showNotification('העוזרת של חננאל',{body:'התראות הופעלו ✓ אזכיר לך משימות ופגישות בזמן',icon:'icon-192.png'});toast('התראות הופעלו ✓')}

const AVC=['#6A5AF9','#E5484D','#12A26B','#D97706','#2F6FED','#8E4EC6','#0EA5A4','#DB2777'];
function av(name,cls=''){const s=String(name||'?').trim()||'?';let x=0;for(const ch of s)x=(x*31+ch.charCodeAt(0))>>>0;const pr=s.split(/\s+/);const ini=(pr[0][0]||'')+(pr[1]?pr[1][0]:'');return `<div class="av ${cls}" style="background:${AVC[x%AVC.length]}">${esc(ini)}</div>`}

/* ---- rows ---- */
function taskRow(t){
  const meta=[];if(t.due)meta.push((t.due<today()&&!t.done?'⚠ ':'')+fmtDay(t.due)+(t.time?' '+t.time:''));else if(t.priority)meta.push(PRI[t.priority]||'');
  if(t.clientId)meta.push(esc(clientName(t.clientId)));if(t.projectId)meta.push('📁 '+esc(projectName(t.projectId)));if(t.assignee)meta.push('👤 '+esc(t.assignee));
  const tm=taskMinutes(t);
  return `<div class="row"><button class="check ${t.done?'on':''}" data-act="tdone" data-id="${t.id}">${ic(I.check,14)}</button>
  <div class="main tap" data-act="task" data-id="${t.id}"><div class="t" style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</div>${meta.length?`<div class="m">${meta.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>
  ${t.done?'':`<button class="timer ${t.running?'run':''}" data-act="timer" data-id="${t.id}">${ic(t.running?I.stop:I.play,11)}${tm>=1?mins(tm):''}</button>`}</div>`;
}
function eventRow(e,showDate){return `<div class="row ${e.fromG?'':'tap'}" ${e.fromG?'':`data-act="event" data-id="${e.id}"`}><div class="timecol"><b>${esc(e.time||'—')}</b>${showDate?`<span>${fmtDay(e.date)}</span>`:e.endTime?`<span>עד ${esc(e.endTime)}</span>`:''}</div><div class="evline"></div><div class="main"><div class="t">${esc(e.title)}${e.fromG?' <span class="kind">Google</span>':''}</div><div class="m">${e.clientId?`<span>${esc(clientName(e.clientId))}</span>`:''}${e.location?`<span>📍 ${esc(e.location)}</span>`:''}</div></div></div>`}
function clientRow(c){const ln=(c.notes||[]).slice(-1)[0];const days=Math.floor((now()-(c.updatedAt||c.createdAt||now()))/864e5);
  return `<div class="row tap" data-act="client" data-id="${c.id}">${av(c.name)}<div class="main"><div class="t">${esc(c.name)}${c.company?` <span class="muted small">· ${esc(c.company)}</span>`:''}</div><div class="m">${c.phone?`<span>${esc(c.phone)}</span>`:''}${c.value?`<span>${money(c.value)}</span>`:''}${c.source?`<span>מקור: ${esc(c.source)}</span>`:''}${ln?`<span>${esc(ln.text.slice(0,50))}</span>`:''}${['lead','talking','quote'].includes(c.status)&&days>=3?`<span style="color:var(--warn)">${days} ימים בלי עדכון</span>`:''}</div></div><span class="pill p-${c.status}">${STATUS_L[c.status]||''}</span></div>`}
function payRow(p){return `<div class="row tap" data-act="payment" data-id="${p.id}"><div class="main"><div class="t">${esc(p.description||'תשלום')}</div><div class="m">${p.clientId?`<span>${esc(clientName(p.clientId))}</span>`:''}<span>${p.status==='paid'?'שולם '+fmtDay(ymd(new Date(p.paidAt||now()))):'לתשלום עד '+fmtDay(p.due)}</span></div></div><span class="amount">${money(p.amount)}</span><span class="pill p-${p.status}">${p.status==='paid'?'שולם':'ממתין'}</span></div>`}
function projRow(p){const st=p.stages||[];const dn=st.filter(s=>s.done).length;const pct=st.length?Math.round(dn/st.length*100):0;
  return `<div class="card tap" data-act="project" data-id="${p.id}" style="padding:13px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div style="font-weight:700">${esc(p.name)}</div><div class="small muted">${esc(clientName(p.clientId)||'ללא לקוח')} · ${PRICING[p.pricing]}${p.pricing==='hourly'?' · '+money(p.rate)+'/ש׳':p.price?' · '+money(p.price):''}</div></div><span class="pill ${p.status==='active'?'p-active':p.status==='done'?'p-done':'p-quote'}">${PSTATUS[p.status]}</span></div>
  ${st.length?`<div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span class="small muted">${dn}/${st.length}</span></div>`:''}
  ${p.pricing==='bank'&&p.hours?`<div class="small muted" style="margin-top:6px">נוצלו ${mins(projMinutes(p.id))} מתוך ${p.hours} שעות</div>`:''}</div>`}

/* ---- views ---- */
function vToday(){
  const td=today();const open=S.tasks.filter(t=>!t.done);
  const overdue=open.filter(t=>t.due&&t.due<td);const tdy=open.filter(t=>t.due===td||(!t.due&&t.priority==='today'));
  const gx=g=>({...g,id:'',fromG:true});const gExtra=d=>(S.gcal||[]).filter(g=>g.date===d&&!S.events.some(e=>e.gid&&e.gid===g.gid)).map(gx);
  const evs=[...S.events.filter(e=>e.date===td),...gExtra(td)].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const tomorrow=[...S.events.filter(e=>e.date===addDays(td,1)),...gExtra(addDays(td,1))].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const leads=S.clients.filter(c=>['lead','talking','quote'].includes(c.status)).sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0));
  const pend=S.payments.filter(p=>p.status==='pending');const late=pend.filter(p=>p.due&&p.due<td);
  const empty=!S.clients.length&&!S.tasks.length&&!S.events.length;
  const doneT=S.tasks.filter(t=>t.done&&t.doneAt&&ymd(new Date(t.doneAt))===td).length;const tot=doneT+tdy.length+overdue.length;const pct=tot?doneT/tot:0;const CC=2*Math.PI*27;const pendSum=pend.reduce((a,p)=>a+(+p.amount||0),0);
  let h=`<div class="hero"><div class="top"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="27" stroke="rgba(255,255,255,.25)" stroke-width="6" fill="none"/><circle cx="32" cy="32" r="27" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${CC*(1-pct)}" style="transition:stroke-dashoffset .8s"/></svg><b>${doneT}/${tot}</b></div><div><h2>${tot?(tot-doneT?'נשארו '+(tot-doneT)+' משימות להיום':'סגרת הכל להיום 🎉'):'יום פתוח לגמרי'}</h2><p>${evs.length} פגישות · ${leads.length} לידים פתוחים${pendSum?' · '+money(pendSum)+' ממתינים':''}</p></div></div><button class="go" data-act="brief">${ic(I.spark,20)}<span>סיכום בוקר מ${esc(asst())}</span>${ic(I.chev,18)}</button></div>`;
  if(cfg.gConnected&&!gOk())h+=`<button class="btn ghost wide" style="margin-bottom:12px" data-act="gconnect">🔗 חבר מחדש את Google (יומן + מייל)</button>`;
  if(empty)h+=`<div class="card"><h3>בוא נתחיל</h3><div class="small muted" style="line-height:1.6">פשוט תכתוב או תקליט ל${asst()} בצ׳אט, למשל:<br>"ליד חדש — דני כהן, 050-1234567, הגיע מאינסטגרם, רוצה 4 רילס בחודש"<br>"תזכירי לי מחר ב-10 להתקשר לרוני"<br>"פגישה ביום חמישי ב-14:00 עם מסעדת יפו"</div><div style="margin-top:12px"><button class="btn primary sm" data-act="view" data-v="chat">לדבר עם העוזרת</button></div></div>`;
  h+=`<div class="card"><h3>היום ביומן <small>${evs.length?'':''}</small></h3>${evs.length?evs.map(eventRow).join(''):'<div class="empty">אין פגישות היום</div>'}${tomorrow.length?`<div class="grp">מחר</div>${tomorrow.map(eventRow).join('')}`:''}</div>`;
  h+=`<div class="card"><h3>משימות</h3>${overdue.length?`<div class="grp red" style="margin-top:0">באיחור</div>${overdue.map(taskRow).join('')}`:''}${tdy.length?(overdue.length?'<div class="grp">להיום</div>':'')+tdy.map(taskRow).join(''):overdue.length?'':'<div class="empty">אין משימות להיום 🎉</div>'}</div>`;
  if(late.length||pend.length)h+=`<div class="card"><h3>כסף שמחכה <small>${money(pend.reduce((a,p)=>a+(+p.amount||0),0))}</small></h3>${(late.length?late:pend.slice(0,3)).map(payRow).join('')}</div>`;
  if(leads.length)h+=`<div class="card"><h3>לידים שמחכים לך</h3>${leads.slice(0,5).map(clientRow).join('')}</div>`;
  return h;
}
function vClients(){
  const f=S.clientFilter;const counts={};S.clients.forEach(c=>counts[c.status]=(counts[c.status]||0)+1);

function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',ul=false;
  for(const l of lines){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+m[1]+'</li>'}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+l+'</p>'}}
  if(ul)h+='</ul>';return h;
}

const parseP=p=>{if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return{text:p.slice(0,6000)}}}return p};
function compactThreads(p){p=parseP(p);const arr=(p&&(p.threads||p.items))||(Array.isArray(p)?p:null);if(!arr)return{raw:JSON.stringify(p).slice(0,5000)};
  return{threads:arr.slice(0,25).map(t=>{const m=(t.messages&&t.messages[0])||t;return{thread_id:t.id,subject:m.subject,from:m.sender,date:m.date,snippet:(m.snippet||'').slice(0,220)}})}}
function compactThread(p){p=parseP(p);const ms=(p&&p.messages)||null;if(!ms)return{raw:JSON.stringify(p).slice(0,6000)};
  return{messages:ms.slice(-3).map(m=>({subject:m.subject,from:m.sender,date:m.date,body:String(m.plaintextBody||m.snippet||'').slice(0,2500),attachments:(m.attachments||[]).map(a=>a.filename||a.name).filter(Boolean).slice(0,5)}))}}

let abortCtl=null;
async function claudeCall(messages,toolsArr){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:cfg.model||MODEL,max_tokens:2048,system:context(),messages,tools:toolsArr.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}))})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const m=(j.error&&j.error.message)||('שגיאה '+r.status);throw{code:r.status===401?'auth':r.status===429?'rate_limited':/credit|balance|billing/i.test(m)?'credit':'api',message:m}}
  return j}
async function runAgent(msgs,toolsArr,onText){let all='',last='';
  for(let i=0;i<10;i++){const j=await claudeCall(msgs,toolsArr);const tus=j.content.filter(b=>b.type==='tool_use');last=j.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(last){all+=(all?'\n':'')+last;onText&&onText(last)}
    if(j.stop_reason!=='tool_use'||!tus.length)break;
    msgs.push({role:'assistant',content:j.content});const results=[];
    for(const tu of tus){const t=toolsArr.find(x=>x.name===tu.name);let out,err=false;try{out=t?await t.execute(tu.input||{}):{error:'unknown tool'}}catch(e){out={error:e.message||String(e)};err=true}
      results.push({type:'tool_result',tool_use_id:tu.id,content:JSON.stringify(out===undefined?{ok:true}:out),is_error:err})}
    msgs.push({role:'user',content:results})}
  return last||all}
function imgToB64(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=rej;im.src=url})}
async function sendChat(text,img){
  text=(text||'').trim();if((!text&&!img)||S.busy)return;
  if(!cfg.apiKey){onboarding();return}
  if(S.view!=='chat')go('chat');
  const hist=S.chat.slice(-14);
  S.chat=[...S.chat,{role:'user',text:text||'(תמונה)',img:!!img,at:now()}];
  S.busy=true;S.liveText='';render();
  const msgs=[];for(const m of hist){const c=m.role==='user'?m.text:(m.text+(m.actions&&m.actions.length?'\n[בוצע: '+m.actions.join(' · ')+']':''));const r=m.role==='user'?'user':'assistant';if(msgs.length&&msgs[msgs.length-1].role===r)msgs[msgs.length-1].content+='\n'+c;else msgs.push({role:r,content:c})}
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const utext=text||'(שלח תמונה — כנראה קבלה או חשבונית)';let ucontent=utext;
  if(img){try{const im=await imgToB64(img);ucontent=[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:im}},{type:'text',text:utext}]}catch(e){}}
  if(msgs.length&&msgs[msgs.length-1].role==='user')msgs.pop();
  msgs.push({role:'user',content:ucontent});
  ACTLOG=[];abortCtl=new AbortController();
  let reply='';
  try{
    reply=await runAgent(msgs,tools(),t=>{S.liveText=t;const el=$('#live');if(el){el.innerHTML=md(t);$('#main').scrollTop=$('#main').scrollHeight}});
  }catch(e){
    reply=(e&&e.text)||'';const code=e&&e.code;
    if(code==='auth')reply+='\n\nמפתח ה-API לא תקין — עדכן אותו בהגדרות ⚙.';
    else if(code==='credit')reply+='\n\nנגמרה היתרה בחשבון Anthropic — צריך לטעון קרדיט ב-platform.claude.com ← Billing.';
    else if(code==='rate_limited')reply+='\n\nיותר מדי בקשות ברצף — נסה שוב בעוד דקה.';
    else if(!reply)reply='משהו השתבש ('+(code||e.message||'שגיאה')+'). נסה שוב.';
  }
  const actions=ACTLOG;ACTLOG=null;
  S.chat=[...S.chat,{role:'assistant',text:reply.trim()||(actions.length?'בוצע ✓':'…'),actions,at:now()}];
  S.busy=false;S.liveText='';render();saveChat();
}

  `<div class="two">${F('price','מחיר / חבילה / חודשי (₪)','number',p.price||'')}${F('rate','מחיר לשעה (₪)','number',p.rate||'')}</div>`+F('hours','כמות שעות בבנק','number',p.hours||'')+
  (p.id?'':F('stages','שלבים (שורה לכל שלב. "תשלום: 1500" לשלב תשלום, "פגישה:" לפגישה)','textarea','','placeholder="פגישת היכרות&#10;צילום&#10;עריכה&#10;תשלום: 1750"')),
  async d=>{if(p.id){await patch('projects',p.id,{name:d.name,clientId:d.client_id,pricing:d.pricing,price:+d.price||0,rate:+d.rate||0,hours:+d.hours||0})}
    else{const stages=(d.stages||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{let m=s.match(/^תשלום\s*[:：-]?\s*(.*?)\s*([\d,]+)?\s*₪?$/);if(m)return{title:(m[1]||'תשלום').trim()||'תשלום',type:'payment',amount:+(m[2]||'0').replace(/,/g,'')};m=s.match(/^פגישה\s*[:：-]?\s*(.*)$/);if(m)return{title:m[1]||'פגישה',type:'meeting'};return{title:s,type:'work'}});
      await addProject({...d,stages})}},p.id?()=>del('project',p.id):null)}
function paymentForm(p={},pre={}){formSheet(p.id?'עריכת תשלום':'בקשת תשלום חדשה',
  F('amount','סכום (₪)','number',p.amount||pre.amount||'','required')+F('description','עבור','text',p.description||pre.description||'')+
  `<div class="two">${F('client_id','לקוח','select',clientOpts(p.clientId||pre.client_id))}${F('project_id','פרויקט','select',projOpts(p.projectId||pre.project_id))}</div>`+F('due','לתשלום עד','date',p.due||today()),
  async d=>{if(p.id)await patch('payments',p.id,{amount:+d.amount||0,description:d.description,clientId:d.client_id,projectId:d.project_id,due:d.due});else await addPayment(d)},p.id?()=>del('payment',p.id):null)}
function expenseForm(e={}){formSheet(e.id?'עריכת הוצאה':'הוצאה חדשה',
  `<div class="two">${F('amount','סכום (₪)','number',e.amount||'','required')}${F('date','תאריך','date',e.date||today())}</div>`+F('supplier','ספק','text',e.supplier)+F('category','קטגוריה','select',opt(EXP_CAT.map(c=>[c,c]),e.category||'אחר'))+F('note','הערה','text',e.note),
  async d=>{if(e.id)await patch('expenses',e.id,{amount:+d.amount||0,date:d.date,supplier:d.supplier,category:d.category,note:d.note});else await addExpense(d)},e.id?()=>del('expense',e.id):null)}
function waLink(phone,text){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='972'+p.slice(1);return p?`https://wa.me/${p}${text?'?text='+encodeURIComponent(text):''}`:''}

function clientSheet(id){S.sheetLive=true;openSheet(()=>{
  const c=find('clients',id);if(!c)return '<div class="empty">הלקוח נמחק</div>';
  const ts=S.tasks.filter(t=>t.clientId===id&&!t.done),ps=S.projects.filter(p=>p.clientId===id),pay=S.payments.filter(p=>p.clientId===id),ev=S.events.filter(e=>e.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const wa=waLink(c.phone);
  return `<div class="sh-head"><div class="chead">${av(c.name,'lg')}<div><h2>${esc(c.name)}</h2><div class="small muted">${esc([c.company,c.phone].filter(Boolean).join(' · ')||STATUS_L[c.status])}</div></div></div><button class="iconbtn" data-act="close">${ic(I.x,18)}</button></div>
  <div class="qa">${wa?`<a class="wa" href="${wa}" target="_blank" rel="noopener"><span class="ico">${ic(I.wa,18)}</span>וואטסאפ</a>`:`<button data-act="editclient" data-id="${id}"><span class="ico">${ic(I.wa,18)}</span>הוסף טלפון</button>`}<button data-act="newtask" data-id="${id}"><span class="ico">${ic(I.check,18)}</span>משימה</button><button data-act="newevent" data-id="${id}"><span class="ico">${ic(I.today,18)}</span>פגישה</button><button data-act="newpay" data-id="${id}"><span class="ico">${ic(I.money,18)}</span>תשלום</button></div><div style="height:10px"></div>
  <div class="chips">${STATUS.map(([k,l])=>`<button class="chip ${c.status===k?'on':''}" data-act="cstatus" data-id="${id}" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="card"><dl class="info">${c.phone?`<dt>טלפון</dt><dd>${esc(c.phone)}</dd>`:''}${c.email?`<dt>מייל</dt><dd>${esc(c.email)}</dd>`:''}${c.source?`<dt>מקור</dt><dd>${esc(c.source)}</dd>`:''}${c.value?`<dt>שווי</dt><dd>${money(c.value)}</dd>`:''}<dt>נוצר</dt><dd>${fmtDay(ymd(new Date(c.createdAt||now())))}</dd></dl>
  <div class="btnrow" style="margin-top:14px"><button class="btn sm ghost" data-act="editclient" data-id="${id}">עריכת פרטים</button><button class="btn sm ghost" data-act="newproject" data-id="${id}">+ פרויקט</button></div></div>
  ${ps.length?`<div class="grp">פרויקטים</div>${ps.map(projRow).join('')}`:''}
  ${ts.length?`<div class="grp">משימות פתוחות</div><div class="card" style="padding:4px 14px">${ts.map(taskRow).join('')}</div>`:''}
  ${pay.length?`<div class="grp">תשלומים</div><div class="card" style="padding:4px 14px">${pay.map(payRow).join('')}</div>`:''}
  ${ev.length?`<div class="grp">פגישות</div><div class="card" style="padding:4px 14px">${ev.slice(0,6).map(e=>eventRow(e,true)).join('')}</div>`:''}
  <div class="grp">היסטוריה והערות</div>
  <div class="field" style="display:flex;gap:8px"><input id="noteIn" placeholder="הוסף הערה…" style="flex:1"><button class="btn sm" data-act="addnote" data-id="${id}">שמור</button></div>
  ${[...(c.notes||[])].reverse().map(n=>`<div class="note">${esc(n.text)}<small>${fmtDay(ymd(new Date(n.at)))} ${hm(new Date(n.at))}</small></div>`).join('')||'<div class="empty">אין הערות</div>'}`})}
function projectSheet(id){S.sheetLive=true;openSheet(()=>{
  const p=find('projects',id);if(!p)return '<div class="empty">הפרויקט נמחק</div>';
  const total=projectTotal(p),paid=projPaid(id),billed=projBilled(id),pm=projMinutes(id);
  const ts=S.tasks.filter(t=>t.projectId===id&&!t.done),pay=S.payments.filter(x=>x.projectId===id);
  return `<div class="sh-head"><div><h2>${esc(p.name)}</h2><div class="small muted">${esc(clientName(p.clientId)||'ללא לקוח')} · ${PRICING[p.pricing]}</div></div><button class="iconbtn" data-act="close">${ic(I.x,18)}</button></div>
  <div class="chips">${Object.entries(PSTATUS).map(([k,l])=>`<button class="chip ${p.status===k?'on':''}" data-act="pstatus" data-id="${id}" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="stats"><div class="stat money"><b>${money(total)}</b><span>${p.pricing==='retainer'?'לחודש':p.pricing==='hourly'?'לפי שעות':'סה״כ'}</span></div><div class="stat money"><b>${money(paid)}</b><span>שולם</span></div><div class="stat"><b>${mins(pm)}</b><span>שעות${p.pricing==='bank'&&p.hours?' / '+p.hours:''}</span></div></div>
  ${p.pricing==='bank'&&p.hours?`<div class="bar" style="margin:-4px 0 12px"><i style="width:${Math.min(100,pm/60/p.hours*100)}%;${pm/60>p.hours?'background:var(--danger)':''}"></i></div>`:''}
  <div class="card"><h3>שלבים <small>${(p.stages||[]).filter(s=>s.done).length}/${(p.stages||[]).length}</small></h3>
  ${(p.stages||[]).map(s=>`<div class="stage"><button class="check ${s.done?'on':''}" data-act="stage" data-id="${id}" data-v="${s.id}">${ic(I.check,14)}</button><span class="k">${STAGE_T[s.type][0]}</span><div class="main" style="flex:1"><div style="${s.done?'text-decoration:line-through;opacity:.55':''}">${esc(s.title)}</div>${s.due?`<div class="small muted">${fmtDay(s.due)}</div>`:''}</div>${s.amount?`<span class="amount">${money(s.amount)}</span>`:''}</div>`).join('')||'<div class="empty">אין שלבים</div>'}
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"><input id="stIn" placeholder="שלב חדש" style="flex:1 1 100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px"><select id="stType" style="flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 6px">${opt(Object.entries(STAGE_T).map(([k,v])=>[k,v[0]+' '+v[1]]),'work')}</select><input id="stAmt" type="number" placeholder="₪" style="width:70px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px"><button class="btn sm" data-act="addstage" data-id="${id}">+</button></div></div>
  <div class="btnrow" style="margin-bottom:12px"><button class="btn sm ghost" data-act="editproject" data-id="${id}">עריכה</button><button class="btn sm ghost" data-act="newtaskp" data-id="${id}">+ משימה</button><button class="btn sm ghost" data-act="newpayp" data-id="${id}">+ בקשת תשלום</button></div>
  ${ts.length?`<div class="grp">משימות</div><div class="card" style="padding:4px 14px">${ts.map(taskRow).join('')}</div>`:''}
  ${pay.length?`<div class="grp">תשלומים · נדרש ${money(billed)}</div><div class="card" style="padding:4px 14px">${pay.map(payRow).join('')}</div>`:''}`})}
function paymentSheet(id){S.sheetLive=true;openSheet(()=>{
  const p=find('payments',id);if(!p)return '<div class="empty">נמחק</div>';const c=find('clients',p.clientId)||{};
  const txt=`היי ${c.name||''}, מצרף בקשת תשלום על סך ${money(p.amount)} עבור ${p.description||'העבודה'}.${S.settings.paymentDetails?'\n\n'+S.settings.paymentDetails:''}\n\nתודה רבה! 🙏`;
  const wa=waLink(c.phone,txt);
  return `<div class="sh-head"><h2>${money(p.amount)}</h2><button class="iconbtn" data-act="close">${ic(I.x,18)}</button></div>
  <div class="card"><dl class="info"><dt>עבור</dt><dd>${esc(p.description||'—')}</dd><dt>לקוח</dt><dd>${esc(c.name||'—')}</dd>${p.projectId?`<dt>פרויקט</dt><dd>${esc(projectName(p.projectId))}</dd>`:''}<dt>סטטוס</dt><dd><span class="pill p-${p.status}">${p.status==='paid'?'שולם':'ממתין'}</span></dd><dt>עד</dt><dd>${fmtDay(p.due)}</dd></dl></div>
  <div class="btnrow">${p.status==='paid'?`<button class="btn ghost" data-act="paid" data-id="${id}" data-v="0">בטל סימון תשלום</button>`:`<button class="btn" data-act="paid" data-id="${id}" data-v="1">✓ סמן ששולם</button>`}
  ${wa&&p.status!=='paid'?`<a class="btn ghost" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">שלח בוואטסאפ</a>`:''}<button class="btn ghost" data-act="editpay" data-id="${id}">עריכה</button></div>
  ${!S.settings.paymentDetails?`<div class="small muted" style="margin-top:12px">טיפ: הוסף פרטי העברה/ביט בהגדרות (⚙) והם יצורפו אוטומטית להודעה.</div>`:''}`})}
function searchSheet(){S.sheetLive=false;openSheet(()=>`<div class="sh-head" style="gap:8px"><input id="q" class="inp" placeholder="חיפוש לקוחות, משימות, פרויקטים…" autocomplete="off"><button class="iconbtn" data-act="close">${ic(I.x,18)}</button></div><div id="qres" class="card sres"><div class="empty">התחל להקליד…</div></div>`);
  const q=$('#q');setTimeout(()=>q.focus(),350);
  q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){$('#qres').innerHTML='<div class="empty">התחל להקליד…</div>';return}const hit=x=>String(x||'').toLowerCase().includes(s);const r=[];
    S.clients.filter(c=>hit(c.name)||hit(c.phone)||hit(c.company)||hit(c.email)||(c.notes||[]).some(n=>hit(n.text))).slice(0,8).forEach(c=>r.push(`<div class="row tap" data-act="client" data-id="${c.id}">${av(c.name,'sm')}<div class="main"><div class="t">${esc(c.name)}</div><div class="m">${esc(c.company||c.phone||'')}</div></div><span class="kind">לקוח</span></div>`));
    S.projects.filter(p=>hit(p.name)).slice(0,5).forEach(p=>r.push(`<div class="row tap" data-act="project" data-id="${p.id}"><div class="main"><div class="t">📁 ${esc(p.name)}</div><div class="m">${esc(clientName(p.clientId))}</div></div><span class="kind">פרויקט</span></div>`));
    S.tasks.filter(t=>hit(t.title)).slice(0,8).forEach(t=>r.push(`<div class="row tap" data-act="task" data-id="${t.id}"><div class="main"><div class="t">${t.done?'✓ ':''}${esc(t.title)}</div><div class="m">${fmtDay(t.due)}</div></div><span class="kind">משימה</span></div>`));
    S.events.filter(e=>hit(e.title)).slice(0,5).forEach(e=>r.push(`<div class="row tap" data-act="event" data-id="${e.id}"><div class="main"><div class="t">${esc(e.title)}</div><div class="m">${fmtDay(e.date)} ${esc(e.time||'')}</div></div><span class="kind">פגישה</span></div>`));
    $('#qres').innerHTML=r.join('')||'<div class="empty">לא נמצא</div>'})}
function settingsSheet(){S.sheetLive=false;const a=S.settings.automations||{};
  formSheet('הגדרות',`<button type="button" class="btn primary wide" data-act="push" style="margin-bottom:8px">🔔 הפעל התראות לטלפון</button><button type="button" class="btn ghost wide" data-act="gconnect" style="margin-bottom:8px">${gOk()?'✅ Google מחובר (Gmail + יומן) — רענן חיבור':'🔗 התחבר לגוגל (Gmail + יומן)'}</button><button type="button" class="btn ghost wide" data-act="keys" style="margin-bottom:14px">🔑 מפתחות וחיבורים</button>${S.syncErr?`<div class="banner err">${esc(S.syncErr)}</div>`:`<div class="small muted" style="margin-bottom:12px">☁️ מסונכרן לענן (GitHub · ${esc(cfg.dataRepo||'—')})</div>`}`+F('ownerName','השם שלך','text',S.settings.ownerName||'חננאל')+F('assistantName','שם העוזרת','text',S.settings.assistantName||'העוזרת')+F('team','חברי צוות (מופרדים בפסיק)','text',(S.settings.team||[]).join(', '))+
    F('paymentDetails','פרטי תשלום שיצורפו לבקשות (ביט / העברה)','textarea',S.settings.paymentDetails||'','placeholder="ביט: 050-0000000&#10;בנק לאומי, סניף…, חשבון…"')+
    `<div class="grp">אוטומציות</div>${[['gcalSync','פגישה חדשה ← גם ליומן Google'],['leadFollowup','ליד חדש ← משימת מעקב למחר'],['paymentStage','שלב תשלום הושלם ← בקשת תשלום'],['projectDone','פרויקט הסתיים ← בקשת יתרה + משימת תודה']].map(([k,l])=>`<label class="toggle"><span>${l}</span><input type="checkbox" name="auto_${k}" ${a[k]===false?'':'checked'}></label>`).join('')}<div style="height:12px"></div>`,
    async d=>{await saveSettings({ownerName:d.ownerName||'חננאל',assistantName:d.assistantName||'העוזרת',team:(d.team||'').split(',').map(s=>s.trim()).filter(Boolean),paymentDetails:d.paymentDetails||'',automations:{gcalSync:!!d.auto_gcalSync,leadFollowup:!!d.auto_leadFollowup,paymentStage:!!d.auto_paymentStage,projectDone:!!d.auto_projectDone}});toast('נשמר')})}

/* ============ actions ============ */
function go(v){S.view=v;renderNav();render();$('#main').scrollTop=v==='chat'?$('#main').scrollHeight:0}
const run=f=>Promise.resolve().then(f).catch(e=>toast(e.message||'שגיאה'));
const A={
  view:(id,v)=>go(v), cf:(id,v)=>{S.clientFilter=v;render()}, work:(id,v)=>{S.work=v;render()}, mt:(id,v)=>{S.moneyTab=v;render()},
  gconnect:()=>googleConnect(),
  push:()=>enablePush().catch(e=>toast(e.message||'שגיאה')), keys:()=>onboarding(),
  showdone:()=>{S.showDone=!S.showDone;render()}, close:closeSheet, settings:settingsSheet, search:searchSheet, cmode:(id,v)=>{S.clientMode=v;render()},
  ask:(id,v)=>sendChat(v),
  brief:()=>sendChat('תני לי סיכום בוקר'),
  scanmail:()=>{if(!mcp){toast('צריך לאשר גישה ל-Gmail — נסה שוב אחרי האישור');}sendChat('סרקי את ה-Gmail שלי מ-30 הימים האחרונים, מצאי קבלות וחשבוניות על הוצאות עסקיות ותוסיפי את מה שחסר להוצאות')},
  fab:()=>{const v=S.view;if(v==='clients')clientForm();else if(v==='work')(S.work==='tasks'?taskForm():S.work==='projects'?projectForm():eventForm());else if(v==='money')(S.moneyTab==='expenses'?expenseForm():paymentForm())},
  client:id=>clientSheet(id), project:id=>projectSheet(id), payment:id=>paymentSheet(id),
  task:id=>taskForm(find('tasks',id)), event:id=>eventForm(find('events',id)), expense:id=>expenseForm(find('expenses',id)),
  tdone:id=>run(()=>{const t=find('tasks',id);return updateTask(id,{done:!t.done})}),
  timer:id=>run(()=>timer(id,!find('tasks',id).running)),
  cstatus:(id,v)=>run(()=>updateClient(id,{status:v})),
  pstatus:(id,v)=>run(async()=>{ACTLOG=[];await setProjectStatus(id,v);const a=ACTLOG;ACTLOG=null;if(a.length>1)toast(a.slice(1).join(' · '))}),
  stage:(id,v)=>run(async()=>{ACTLOG=[];await toggleStage(id,v);const a=ACTLOG;ACTLOG=null;if(a.length>1)toast(a.slice(1).join(' · '))}),
  addstage:id=>run(async()=>{const t=$('#stIn').value.trim();if(!t)return;await addStage(id,{title:t,type:$('#stType').value,amount:+$('#stAmt').value||0})}),
  addnote:id=>run(async()=>{const t=$('#noteIn').value.trim();if(!t)return;$('#noteIn').value='';await updateClient(id,{add_note:t})}),
  editclient:id=>clientForm(find('clients',id)), editproject:id=>projectForm(find('projects',id)), editpay:id=>paymentForm(find('payments',id)),
  newtask:id=>taskForm({},{client_id:id}), newevent:id=>eventForm({},{client_id:id}), newproject:id=>projectForm({},{client_id:id}), newpay:id=>paymentForm({},{client_id:id}),
  newtaskp:id=>taskForm({},{project_id:id,client_id:(find('projects',id)||{}).clientId}), newpayp:id=>{const p=find('projects',id)||{};paymentForm({},{project_id:id,client_id:p.clientId,description:p.name})},
  paid:(id,v)=>run(()=>markPaid(id,v==='1')),
  delconfirm:(id,v,el)=>{if(el.dataset.sure){run(async()=>{await window._del();closeSheet();toast('נמחק')})}else{el.dataset.sure='1';el.textContent='בטוח? לחץ שוב למחיקה'}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault&&el.tagName!=='A'&&e.preventDefault();f(el.dataset.id,el.dataset.v,el,e)}});
init();
</script>
