<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#C9773F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Look Up">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="lookup-icon-180.png">
<link rel="icon" href="lookup-icon-192.png">
<title>Look Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Unbounded:wght@500;600&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look Up v11 (EN/ES/FR/HE/AR) v10: English default + Hebrew (RTL), iOS-style navigation (push/pop, edge swipe, haptics, sheets you can drag down),
   Apple Screen Time style picker with real app icons, demo home screen, tab bar (Today / Progress / Settings), one onboarding progress bar */
/* earlier v9: Cal AI onboarding patterns Â· v8: any app + categories Â· v7: Steven Cravotta blueprint Â· design: Passion Finder + Stress glass */
:root{
  --ink:#231A14; --w90:rgba(255,255,255,.92); --w70:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.17); --gline:rgba(255,255,255,.32);
  --amber:#FFC979; --ease:cubic-bezier(.22,.8,.26,1);
  --photo:url("https://images.unsplash.com/photo-1788094667065-2ffdca7a66fc?w=900&q=80");
  --photoNight:url("https://images.unsplash.com/photo-1581491608595-6dadce30433a?w=900&q=80");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;color:#fff;font-family:Heebo,"Noto Sans Arabic",-apple-system,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overscroll-behavior:none;background:#B9683A;overflow:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(70% 40% at 90% 0%,#A7A3B4 0%,rgba(167,163,180,0) 70%),
   radial-gradient(60% 35% at 0% 18%,#7A5546 0%,rgba(122,85,70,0) 70%),
   radial-gradient(75% 45% at 40% 62%,#F09A3E 0%,rgba(240,154,62,0) 70%),
   radial-gradient(55% 35% at 100% 80%,#E27A33 0%,rgba(226,122,51,0) 70%),
   radial-gradient(70% 35% at 0% 100%,#8A6E8C 0%,rgba(138,110,140,0) 70%),
   linear-gradient(175deg,#8E6A5E 0%,#B9764A 35%,#D9802F 62%,#A4705F 100%)}
.mesh::after{content:"";position:absolute;inset:0;opacity:.2;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 800' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='white' stroke-width='.8'><ellipse cx='200' cy='420' rx='150' ry='330'/><ellipse cx='200' cy='420' rx='150' ry='330' transform='rotate(40 200 420)'/><ellipse cx='200' cy='420' rx='150' ry='330' transform='rotate(-40 200 420)'/><circle cx='200' cy='420' r='360'/></g></svg>") center/cover}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[dir=ltr] svg.fl{transform:scaleX(-1)}

/* screens + iOS-like transitions */
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;z-index:2}
.screen.out{display:flex;pointer-events:none;z-index:1}
.screen.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 100px)}
.screen>*{flex-shrink:0;position:relative}
.screen>.grow{flex:1;flex-shrink:1}
@keyframes inFromEnd{from{opacity:0;transform:translateX(44px)}}
@keyframes inFromStart{from{opacity:0;transform:translateX(-44px)}}
@keyframes outToStart{to{opacity:0;transform:translateX(-30px)}}
@keyframes outToEnd{to{opacity:0;transform:translateX(30px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.35)}}
@keyframes upIn{from{opacity:0;transform:translateY(40px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
[dir=ltr] .a-push-in,[dir=rtl] .a-pop-in{animation:inFromEnd .42s var(--ease) .1s both}
[dir=rtl] .a-push-in,[dir=ltr] .a-pop-in{animation:inFromStart .42s var(--ease) .1s both}
[dir=ltr] .a-push-out,[dir=rtl] .a-pop-out{animation:outToStart .18s ease both}
[dir=rtl] .a-push-out,[dir=ltr] .a-pop-out{animation:outToEnd .18s ease both}
.a-fade-in{animation:fadeIn .28s ease both}.a-fade-out{display:none!important}.a-zoom-out,.a-up-out{animation:fadeOut .16s ease both}
.a-zoom-in{animation:zoomIn .5s cubic-bezier(.2,.9,.25,1) both}
.a-up-in{animation:upIn .45s var(--ease) both}
.a-push-in>*,.a-up-in>*{animation:rise .5s var(--ease) both}
.a-push-in>:nth-child(2),.a-up-in>:nth-child(2){animation-delay:.03s}.a-push-in>:nth-child(3),.a-up-in>:nth-child(3){animation-delay:.06s}
.a-push-in>:nth-child(4),.a-up-in>:nth-child(4){animation-delay:.09s}.a-push-in>:nth-child(5),.a-up-in>:nth-child(5){animation-delay:.12s}
.a-push-in>:nth-child(n+6),.a-up-in>:nth-child(n+6){animation-delay:.15s}

/* type */
.brand{font-family:Unbounded,Heebo,sans-serif;font-weight:600;font-size:26px;line-height:1;letter-spacing:.5px;text-align:center;direction:ltr;text-transform:uppercase}
.brand.sm{font-size:16px;letter-spacing:1px}
h1.t{font-size:30px;line-height:1.18;font-weight:600;letter-spacing:-.4px;text-align:center;margin-top:18px;text-shadow:0 1px 14px rgba(80,30,0,.25)}
.d{font-size:16.5px;line-height:1.5;text-align:center;color:var(--w90);margin:10px auto 0;max-width:330px}
.lbl{font-size:15px;font-weight:600;margin:24px 0 10px;color:#fff;display:flex;align-items:baseline;gap:6px}
.lbl small{font-weight:400;color:var(--w70);font-size:14px}
.lbl .end{margin-inline-start:auto;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.num{font-weight:300;letter-spacing:-2px;line-height:.95}
.num small{font-size:.32em;letter-spacing:0;font-weight:400;opacity:.8;margin-inline-start:4px}

/* top bar */
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:48px;gap:8px}
.top>:last-child{justify-self:end}
.gbtn{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--gline);display:grid;place-items:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s}
.gbtn:active{transform:scale(.9)}
.gbtn svg{width:20px;height:20px}
.obbar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;margin:0 6px}
.obbar b{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .5s var(--ease)}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--glass);border:1px solid var(--gline);font-size:14.5px;font-weight:500;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.langbtn svg{width:18px;height:18px}

/* glass surfaces */
.glass{background:var(--glass);border:1px solid var(--gline);border-radius:26px;backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2)}
.solid{background:#FFF;color:var(--ink);border-radius:26px}
.rowg{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin-bottom:8px;min-height:64px}
.rowg .tx{flex:1;min-width:0}
.rowg .tx b{display:block;font-size:17px;font-weight:500}
.rowg .tx small{display:block;font-size:14px;color:var(--w90);margin-top:1px;line-height:1.35}
.rowg .ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.rowg .ic svg{width:19px;height:19px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:9px}
.bar b{display:block;height:100%;width:var(--w);background:#fff;border-radius:3px}
.time{border:0;background:#fff;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:600;font-size:16px;min-width:78px;text-align:center}
.tgl{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.3);position:relative;transition:.25s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.25s var(--ease)}
.tgl.on{background:#34C759}
.tgl.on::after{inset-inline-start:23px}

/* bubbles */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;padding:6px 0}
.bub{--s:96px;width:var(--s);height:var(--s);border-radius:50%;margin:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:500;line-height:1.15;padding:8px;position:relative;
  background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s var(--ease),background .2s}
.bub:active{transform:scale(.94)}
.bub.on{background:#FFF8F1;color:var(--ink);border-color:#fff;box-shadow:0 10px 24px -12px rgba(80,30,0,.45);z-index:1}
.bub.photo{background:center/cover;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);border:3px solid #fff;justify-content:flex-end;padding-bottom:12px}
.bub .x{position:absolute;top:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.bub .x svg{width:13px;height:13px;stroke-width:2.6}
.bub.add{border:1.5px dashed rgba(255,255,255,.7);background:transparent}
.bub small{font-size:12.5px;font-weight:400;opacity:.85;margin-top:2px}
.bub svg.i{width:22px;height:22px;margin-bottom:4px}

/* buttons */
.pill{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;width:100%;height:58px;border-radius:18px;font-size:17.5px;font-weight:600;transition:transform .15s var(--ease),opacity .2s}
.pill:active{transform:scale(.97)}
.pill.white{background:#fff;color:var(--ink);box-shadow:0 10px 26px -14px rgba(70,25,0,.6)}
.pill.glassb{background:rgba(255,255,255,.22);border:1px solid var(--gline);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pill.ink{background:var(--ink);color:#fff}
.pill.link{height:46px;color:var(--w90);font-weight:500;font-size:16px}
.pill[disabled]{opacity:.4}
.pill svg{width:20px;height:20px}
.duo{display:flex;gap:10px;padding-top:16px}
.foot{text-align:center;font-size:14.5px;margin-top:12px;color:var(--w90)}

/* photo circle with arc */
.circ{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:0 auto}
.circ .ph{position:absolute;inset:14px;border-radius:50%;background:var(--photo) center/cover;box-shadow:0 24px 50px -18px rgba(70,25,0,.6);transition:transform 3s cubic-bezier(.45,0,.35,1)}
.circ svg.arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) scaleX(-1)}
.circ svg.arc circle{fill:none;stroke-width:2}
.circ svg.arc .bgc{stroke:rgba(255,255,255,.25)}
.circ svg.arc .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.round{width:96px;height:96px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;margin:0 auto;box-shadow:0 16px 36px -14px rgba(70,25,0,.55);font-size:16px;font-weight:600;line-height:1.1;text-align:center;transition:transform .15s}
.round:active{transform:scale(.93)}
.round svg{width:30px;height:30px;color:#D9652A}
.round.big{width:118px;height:118px}

/* tiles + gauge */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:30px;padding:18px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .h{font-size:15.5px;font-weight:500}
.tile .num{font-size:52px}
.tile small.s{font-size:12.5px;opacity:.75;line-height:1.35}
.solid .h{color:#5E4E42}
.gauge{position:relative;padding:20px 18px 18px;border-radius:34px;margin-top:14px;text-align:center}
.gauge .h{display:flex;justify-content:space-between;align-items:baseline;font-size:15.5px;font-weight:500;color:var(--w90)}
.gauge .num{font-size:84px;margin-top:4px;text-align:start}
.gauge svg.g{width:100%;max-width:300px;height:auto;display:block;margin:-6px auto 0}
.gauge .heart{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
.gauge .heart:active{transform:translateX(-50%) scale(.92)}
.gauge .gl{display:flex;justify-content:space-between;font-size:13px;color:var(--w90);margin-top:-6px;padding:0 10px}
.week{display:flex;gap:6px;align-items:flex-end;height:120px;padding:6px 0 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week em{font-style:normal;font-size:13px;font-weight:600;min-height:16px}
.week i{width:100%;max-width:26px;border-radius:13px;background:rgba(255,255,255,.22);flex:1;position:relative;overflow:hidden}
.week i::after{content:"";position:absolute;inset:auto 0 0;height:var(--h);background:#fff;border-radius:13px;transition:height .6s var(--ease)}
.week span{font-size:13px;color:var(--w90)}
.week .today span{color:#fff;font-weight:700}
.status{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:#FFF8F1;color:var(--ink);margin-top:12px}
.status .tx{flex:1}.status b{display:block;font-size:16px;font-weight:600}.status small{font-size:14px;color:#6B5B4E}
.status .go{height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap}
.streak{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:20px;background:rgba(255,255,255,.2);border:1px solid var(--gline);font-size:16px;justify-self:start}
.streak svg{width:18px;height:18px;color:#FFD08A;fill:#FFD08A;stroke:none}
.miles{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
.miles div{flex:1;text-align:center;font-size:12.5px;color:var(--w90)}
.miles i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 5px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);font-style:normal;font-weight:600;font-size:16px}
.miles .ok i{background:#fff;color:#D9652A;border:0}

/* photos + fields */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid .pt{aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,.2) center/cover;position:relative;border:1px solid var(--gline)}
.pgrid .pt button{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.pgrid .pt button svg{width:14px;height:14px;stroke-width:2.6}
.pgrid label.pt{display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.7);background:transparent;font-size:14px;font-weight:500;text-align:center;cursor:pointer}
.pgrid label.pt svg{width:24px;height:24px;margin:0 auto 4px;display:block}
.field{width:100%;height:54px;border-radius:16px;border:1px solid var(--gline);background:rgba(255,255,255,.22);padding:0 16px;font-size:17px;outline:none;color:#fff}
.field::placeholder{color:rgba(255,255,255,.75)}
.cust{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cust span{display:inline-flex;align-items:center;gap:6px;height:40px;padding-inline:14px 8px;border-radius:20px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.cust button{width:26px;height:26px;display:grid;place-items:center;color:#7A6A5D}
.cust button svg{width:14px;height:14px}

/* connect steps */
.step{display:flex;gap:12px;padding:16px;border-bottom:1px solid rgba(255,255,255,.2)}
.step:last-child{border:0}
.step .k{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);font-size:15px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.step p{font-size:16px;line-height:1.55}
.step ul{margin:6px 0 0;padding-inline-start:18px;font-size:15.5px;line-height:1.6;color:var(--w90)}
.copy{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);font-size:14.5px;font-weight:600}
.copy svg{width:16px;height:16px}
.gapp{display:flex;align-items:center;gap:10px;margin-top:10px}
.gapp b{font-size:15.5px;font-weight:500}

/* pause */
#pause .bgph{position:fixed!important;inset:-60px;background:center/cover;filter:blur(50px) saturate(1.2);opacity:.3;z-index:0;mix-blend-mode:soft-light}
#pause .circ{margin-top:3vh}
#pause .msg{opacity:0;transform:translateY(8px);transition:all .9s var(--ease);text-align:center}
#pause .msg.on{opacity:1;transform:none}
#pause .title{font-size:30px;font-weight:600;line-height:1.18;margin-top:20px;text-shadow:0 1px 14px rgba(80,30,0,.3)}
#pause .idea{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:20px;max-width:330px}
#pause .idea small{display:block;font-size:13px;font-weight:600;color:var(--amber);margin-bottom:2px}
#pause .idea span{font-size:18.5px;font-weight:500;line-height:1.35}
#pause .cue{text-align:center;font-size:18px;font-weight:500;margin-top:16px;min-height:26px}
#pause .ph{transform:scale(.86)}
#pause.in .ph{transform:scale(1)}
#pause.out .ph{transform:scale(.9)}
#pause .round{opacity:.5;pointer-events:none;transition:opacity .5s,transform .15s}
#pause.ready .round{opacity:1;pointer-events:auto}
#pause .anyway{opacity:0;pointer-events:none;transition:opacity .6s;margin-top:12px;width:auto;padding:0 20px;height:46px;flex:none;align-self:center;font-size:15.5px;font-weight:500}
#pause.ready .anyway{opacity:1;pointer-events:auto}
.top>.pchip{justify-self:center}
.pchip{display:inline-flex;align-items:center;gap:8px;height:36px;padding-inline:5px 12px;border-radius:18px;background:rgba(0,0,0,.22);font-size:14.5px;font-weight:500}

/* quiz, plan, paywall */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 18px;border-radius:20px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:17px;font-weight:500;text-align:start;transition:background .15s,transform .15s}
.opt:active{transform:scale(.98)}
.opt .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);margin-inline-start:auto;display:grid;place-items:center;flex-shrink:0}
.opt .ck svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on{background:#FFF8F1;color:var(--ink);border-color:#fff}
.opt.on .ck{background:#D9652A;border-color:#D9652A;color:#fff}
.opt.on .ck svg{opacity:1}
.opt.multi .ck{border-radius:8px}
.qhint{text-align:center;font-size:14px;color:var(--w90);margin-top:10px}
.plan{padding:6px 18px;margin-top:16px}
.plan .pr{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.plan .pr:last-child{border:0}
.plan .pr .ic{width:36px;height:36px;border-radius:50%;background:#fff;color:#D9652A;display:grid;place-items:center;flex-shrink:0}
.plan .pr .ic svg{width:18px;height:18px}
.plan .pr b{display:block;font-size:16.5px;font-weight:600}
.plan .pr span{display:block;font-size:15px;color:var(--w90);line-height:1.45;margin-top:2px}
.science{font-size:13.5px;line-height:1.5;color:var(--w90);text-align:center;margin-top:14px;padding:0 6px}
.tl{margin:26px auto 0;max-width:340px;position:relative}
.tl::before{content:"";position:absolute;top:22px;bottom:22px;inset-inline-start:19px;width:2px;background:linear-gradient(#fff,rgba(255,255,255,.3))}
.tl .st{display:flex;gap:14px;align-items:flex-start;padding:10px 0;position:relative}
.tl .dot{width:40px;height:40px;border-radius:50%;background:#fff;color:#D9652A;display:grid;place-items:center;flex-shrink:0}
.tl .dot svg{width:20px;height:20px}
.tl .dot.dim{background:rgba(255,255,255,.3);color:#fff}
.tl b{display:block;font-size:17px;font-weight:600}
.tl span{display:block;font-size:15px;color:var(--w90);margin-top:2px;line-height:1.4}
.plans{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.plancard{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px;border-radius:22px;background:var(--glass);border:1.5px solid var(--gline);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:start;transition:transform .15s}
.plancard:active{transform:scale(.98)}
.plancard.on{background:#FFF8F1;color:var(--ink);border-color:#fff}
.plancard .tx{flex:1}
.plancard b{display:block;font-size:18px;font-weight:600}
.plancard small{display:block;font-size:14px;opacity:.85;margin-top:2px}
.plancard .price{text-align:end}
.plancard .price b{font-size:20px}
.plancard .tag{position:absolute;top:-11px;inset-inline-start:18px;background:#34A853;color:#fff;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:10px}
.goalchip{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:8px 14px;border-radius:14px;background:rgba(0,0,0,.18);font-size:14.5px;font-weight:500;width:fit-content}
.goalchip svg{width:18px;height:18px}
.fine{text-align:center;font-size:13.5px;line-height:1.5;color:var(--w90);margin-top:10px}
.links{display:flex;justify-content:center;gap:18px;margin-top:6px;font-size:13.5px;color:var(--w90)}
.links button{text-decoration:underline;text-underline-offset:3px}
.chart{width:100%;height:auto;display:block;direction:ltr}
.bbar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin:18px auto 0;max-width:320px}
.bbar b{display:block;height:100%;width:0;background:#fff;border-radius:4px}
.blist{padding:6px 18px;margin-top:18px}
.bi{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:16.5px;font-weight:500;opacity:.55;transition:opacity .3s}
.bi.ok{opacity:1}
.bk{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);display:grid;place-items:center;flex-shrink:0;transition:all .3s}
.bk svg{width:14px;height:14px;stroke-width:3;opacity:0}
.bi.ok .bk{background:#fff;color:#34A853;border-color:#fff}
.bi.ok .bk svg{opacity:1}
.phero{margin-top:16px;padding:18px 20px;text-align:center;border-radius:26px}
.phero small{display:block;font-size:14.5px;font-weight:600;color:#C2541C}
.phero .num{color:var(--ink);margin-top:4px}
.phero>span{display:block;font-size:15px;color:#6B5B4E;margin-top:6px}
.xbtn{opacity:0;pointer-events:none;transition:opacity .4s}
.xbtn.show{opacity:.85;pointer-events:auto}
.offer{margin-top:16px;padding:18px;border-radius:22px;background:#fff;border:1.5px solid #F2D6BF}
.offer b{display:block;font-size:18px;font-weight:700}
.offer span{display:block;font-size:15px;color:#6B5B4E;margin-top:6px}
.offer span b{display:inline;font-size:16px;color:var(--ink)}
.fact{padding:26px 22px;text-align:center}
.fact .num{font-size:88px}
.fact p{font-size:17.5px;line-height:1.55;margin-top:10px;color:#fff}
.vals{display:flex;flex-direction:column;gap:10px;margin:18px auto 0;max-width:340px}
.vals div{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}
.vals svg{width:20px;height:20px;color:#fff;flex-shrink:0}
.hold{cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold .holdin{position:absolute;inset:18px;border-radius:50%;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;text-align:center;line-height:1.15;box-shadow:0 16px 36px -14px rgba(70,25,0,.55);transition:transform .3s var(--ease)}
.hold .holdin svg{width:32px;height:32px;color:#D9652A}
.hold.down .holdin{transform:scale(.94)}
.hold svg.arc .fg{stroke-width:6}
.demo{display:inline-block;margin:0 auto;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:10px}

/* app icons (real brand marks, iOS squircle) */
.aic{display:grid;place-items:center;flex-shrink:0;overflow:hidden;box-shadow:0 4px 12px -5px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(0,0,0,.08);transition:transform .15s,filter .15s}
.aic svg{display:block}
.cic{display:grid;place-items:center;color:#fff;flex-shrink:0}
.cic svg{width:58%;height:58%;stroke-width:2}
.selcard{display:flex;align-items:center;gap:12px;width:100%;padding:16px;margin-top:22px;text-align:start;transition:transform .15s}
.selcard:active{transform:scale(.98)}
.selcard .tx{flex:1;min-width:0}
.selcard b{display:block;font-size:17px;font-weight:600}
.selcard small{display:block;font-size:14px;color:var(--w90);margin-top:3px;line-height:1.35}
.stack{display:flex;align-items:center;margin-top:12px;flex-wrap:wrap;gap:6px 0}
.stack>.aic,.stack>.cic{margin-inline-end:-9px;border:2px solid #fff}
.stack>em{font-style:normal;margin-inline-start:16px;font-size:14px;font-weight:600}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{height:40px;padding:0 15px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid var(--gline);font-size:14.5px;font-weight:500;transition:transform .15s}
.presets button:active{transform:scale(.95)}

/* Apple-style activity picker (what FamilyActivityPicker looks like in the native app) */
.sheet.ios>div{background:#F2F2F7;color:#000;font-family:-apple-system,"SF Pro Text",system-ui,Heebo,sans-serif;height:93vh;max-height:none;padding:0 16px calc(env(safe-area-inset-bottom) + 24px);border-radius:14px 14px 0 0}
.sheet.ios>div::before{display:none}
.pkh{position:sticky;top:0;background:rgba(242,242,247,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0 10px;z-index:3;margin:0 -16px;padding-inline:16px}
.pkh button{color:#007AFF;font-size:17px;justify-self:start}
.pkh button.b{font-weight:600;justify-self:end}
.pkh div{text-align:center}.pkh b{display:block;font-size:17px;font-weight:600}.pkh small{font-size:13px;color:#8E8E93}
.pks{display:flex;align-items:center;gap:6px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);padding:0 8px;color:#8E8E93;margin:4px 0 20px}
.pks svg{width:17px;height:17px}
.pks input{flex:1;border:0;background:none;outline:none;font-size:17px;color:#000;min-width:0}
.pksec{font-size:13px;color:#6D6D72;text-transform:uppercase;padding:0 16px 7px}
.pkg{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:24px}
.pkr{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:5px 12px 5px 16px;padding-inline:16px 8px;position:relative;font-size:17px;cursor:pointer}
.pkr:active{background:#E5E5EA}
.pkr+.pkr::before{content:"";position:absolute;top:0;inset-inline-start:58px;inset-inline-end:0;height:.5px;background:#C6C6C8}
.pkr.sub{padding-inline-start:52px;background:#FAFAFC}
.pkr.sub+.pkr::before,.pkr+.pkr.sub::before{inset-inline-start:94px}
.pkc{width:23px;height:23px;border-radius:50%;border:1.5px solid #C7C7CC;display:grid;place-items:center;flex-shrink:0;transition:background .15s}
.pkc svg{width:13px;height:13px;stroke:#fff;stroke-width:3;opacity:0}
.pkr.on .pkc{background:#007AFF;border-color:#007AFF}.pkr.on .pkc svg{opacity:1}
.pkr.via .pkc{background:#9CC6F7;border-color:#9CC6F7}.pkr.via .pkc svg{opacity:1}
.pkr .tx{flex:1;min-width:0}.pkr .tx small{display:block;font-size:13px;color:#8E8E93;margin-top:1px}
.pkx{width:40px;height:40px;display:grid;place-items:center;color:#C4C4C7;transition:transform .25s}
.pkx svg{width:18px;height:18px;stroke-width:2.4}
.pkx.open{transform:rotate(180deg)}
.pkf{font-size:13px;color:#8E8E93;text-align:center;padding:0 16px;line-height:1.45}

/* demo iPhone home screen */
#spring{padding-left:24px;padding-right:24px}
#spring .wall{position:fixed!important;inset:0;background:center/cover;z-index:0}
#spring .wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.35))}
.sbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 8px;margin-top:22px}
.sbapp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);font-family:-apple-system,system-ui,Heebo,sans-serif;font-weight:500}
.sbapp:active .aic{transform:scale(.86);filter:brightness(.75)}
.sbapp:first-child .aic{animation:nudge 2.2s ease-in-out 1s infinite}
@keyframes nudge{0%,70%,100%{transform:none}78%{transform:scale(1.1)}86%{transform:scale(.97)}}
.sbhint{text-align:center;font-size:16px;font-weight:600;margin-bottom:14px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.sbdock{display:flex;justify-content:space-around;padding:14px 10px;border-radius:34px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5)}
.sbdots{display:flex;justify-content:center;gap:7px;margin-bottom:12px}.sbdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.sbdots i:first-child{background:#fff}

/* settings list (iOS grouped, warm) */
.slist{background:#FFF8F1;color:var(--ink);border-radius:24px;overflow:hidden;margin-top:12px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 16px;min-height:62px;position:relative;transition:background .15s}
.srow:active{background:#F1E6DA}
.srow+.srow::before{content:"";position:absolute;top:0;inset-inline-start:68px;inset-inline-end:0;height:1px;background:#EFE4D8}
.srow .ic{width:38px;height:38px;border-radius:11px;background:#D9652A;color:#fff;display:grid;place-items:center;flex-shrink:0}
.srow .ic svg{width:20px;height:20px}
.srow .tx{flex:1;min-width:0}.srow b{display:block;font-size:17px;font-weight:500}.srow small{display:block;font-size:14px;color:#7A6A5D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .end{color:#B3A396}
.shead{font-size:13.5px;font-weight:600;color:var(--w90);margin:22px 6px 0;text-transform:uppercase;letter-spacing:.3px}

/* tab bar (floating glass) */
#tabbar{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:66px;border-radius:26px;display:none;grid-template-columns:repeat(3,1fr);z-index:15;background:rgba(70,35,15,.32);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:0 14px 34px -16px rgba(40,15,0,.6);padding:6px}
#tabbar.on{display:grid;animation:fadeIn .3s}
#tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:rgba(255,255,255,.72);border-radius:20px;transition:background .2s,color .2s}
#tabbar button svg{width:23px;height:23px}
#tabbar button.on{color:#fff;background:rgba(255,255,255,.2)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(40,15,0,.4);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex;animation:dimIn .3s}
@keyframes dimIn{from{background:rgba(40,15,0,0)}}
.sheet>div{background:#FFF8F1;color:var(--ink);width:100%;border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow-y:auto;transition:transform .3s var(--ease)}
.sheet.on>div{animation:sheetUp .42s var(--ease)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet>div::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#E1D3C4;margin:0 auto 14px}
.sheet h2{font-size:24px;font-weight:700}
.sheet .lbl{color:var(--ink)}
.sheet .lbl small{color:#8A7B6E}
.sheet .sf{width:100%;height:54px;border-radius:16px;border:1.5px solid #EADFD2;background:#fff;padding:0 16px;font-size:17px;outline:none}
.sheet .sf:focus{border-color:#D9652A}
.sheet .chips{display:flex;flex-wrap:wrap;gap:8px}
.sheet .chip{min-height:46px;padding:0 18px;border-radius:23px;border:1.5px solid #EADFD2;background:#fff;font-size:16px;font-weight:500}
.sheet .chip.on{background:#D9652A;border-color:#D9652A;color:#fff}
.sheet .pgrid .pt{background-color:#F1E6DA;border-color:#EADFD2}
.sheet .pgrid label.pt{border-color:#D8C6B4;color:#6B5B4E}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:16px 6px;border-bottom:1px solid #EFE4D8;font-size:18px;font-weight:500;text-align:start}
.lrow:last-child{border:0}
.lrow small{font-size:14px;color:#8A7B6E;font-weight:400;margin-inline-start:6px}
.lrow .c{margin-inline-start:auto;color:#D9652A;opacity:0}.lrow.on .c{opacity:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-20px);background:#fff;color:var(--ink);padding:12px 20px;border-radius:16px;font-size:15px;font-weight:500;opacity:0;transition:.3s;z-index:40;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.3);width:max-content;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function resize(file,max=1400){return new Promise(r=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=w*k;c.height=h*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8));URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)})}
const urlCache={};async function photo(id){if(!id)return'';if(urlCache[id])return urlCache[id];const v=await DB.get(id);urlCache[id]=v||'';return urlCache[id]}

/* ---------- time logic ---------- */
const mins=x=>{const[h,m]=x.split(':').map(Number);return h*60+m};
function mode(d=new Date()){const T=st.times,now=d.getHours()*60+d.getMinutes(),day=d.getDay();
 if(now>=mins(T.nStart)||now<240)return'night';
 if(now<mins(T.mEnd))return'morning';
 const shab=T.shabbat&&((day===5&&now>=mins('17:00'))||day===6);
 if((now>=mins(T.fStart)&&now<mins(T.fEnd))||shab)return st.people.length?'family':'day';
 return'day'}

 clearTimeout(navT);document.querySelectorAll('.screen.out').forEach(s=>s.className=s.className.replace(/\s?(out|a-\S+)/g,''));
 if(prev&&prev!==el){prev.classList.remove('on');if(anim!=='none'){prev.classList.add('out','a-'+anim+'-out')}}
 el.className=el.className.replace(/\s?a-\S+/g,'');el.classList.add('on');void el.offsetWidth;if(anim!=='none'&&prev!==el)el.classList.add('a-'+anim+'-in');
 navT=setTimeout(()=>{document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('out');s.className=s.className.replace(/\s?a-\S+/g,'')})},520);
 el.scrollTop=0;
 const tb=TABS.includes(id);$('tabbar').classList.toggle('on',tb);document.body.classList.toggle('tabs',tb);
 document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
 const ob=el.querySelector('.obbar');if(ob){const hide=editing||st.setup;ob.style.visibility=hide?'hidden':'';const n=id==='quiz'?qi+1:QZ.length+ONB.indexOf(id)+1;ob.firstElementChild.style.width=(n/OBTOT*100)+'%'}
 ({ob2:renderPeople,ob3:renderGeneral,ob4:loadTimes,ob5:renderGuide,home:renderHome,stats:renderStats,settings:renderSettings,build:runBuild,pw3:renderPw3,quiz:renderQuiz,plan:renderPlan,apps:renderApps,commit:renderCommit,spring:renderSpring}[id]||(()=>{}))();
 if(id==='first'||id==='pw1')photo(anyPic()).then(s=>{if(s)$(id==='first'?'firstPh':'pw1ph').style.backgroundImage=`url(${s})`})}

 const t0=performance.now(),D=4200;let lastK=-1;
 const tick=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,2.2),v=Math.round(e*100);
  $('bPct').textContent=v+'%';$('bBar').style.width=v+'%';
  const k=Math.min(steps.length-1,Math.floor(e*steps.length));if(k!==lastK){lastK=k;if(k>0)hap()}
  steps.forEach((_,i)=>$('bi'+i).classList.toggle('ok',i<k||p===1));
  $('bNow').textContent=p<1?t('b_now',steps[k]):t('b_ready');
  const here=$('build').classList.contains('on');if(!here)return;

async function resetAll(){if(!confirm(t('reset_q')))return;await DB.clear();const l=st.lang;localStorage.removeItem('lu');if(l)S.set({lang:l});location.hash='';location.reload()}

/* ---------- boot ---------- */
function boot(){applyLang();const h=location.hash.slice(1),q=new URLSearchParams(h.replace(/^pause&?/,''));
 if(h.startsWith('pause')){const app=q.get('app')||'instagram';history.replaceState(null,'',location.pathname);
  if(!st.setup){pendingApp=app;go('ob1',{anim:'none'});return}st.connected=true;save();startPause(app,false,'none');return}
 go(st.setup?'home':'ob1',{anim:'none'})}
boot();
if('serviceWorker' in navigator&&!location.pathname.includes('/lookup')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
