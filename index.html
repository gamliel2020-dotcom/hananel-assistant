/* Look Up v40: home logo = mark + LOOK UP wordmark, big breathe text + dark strip on pause, plan shows its math, strict family time (30s wait), gentle reminders card (saved v39 = /saved-v39/) · v39: moments with your people (Progress + Done), new Settings: people first, pause feel (breaths, sound, usual open time), privacy (saved v38 = /saved-v38/) · v38: breathing pause over your person's photo + breath sound/mute, "open for X minutes" wheel, open-session bar, quiet times + day of rest (saved v37 = /saved-v37/) · v37: removed "Photos you love" from the ideas screen (photos come from your people) · v36: clearer "how does phone time affect you?" + required name/photo marks in Add person · v35: Cal AI-style week strip on Home (saved v34 = /saved-v34/) · v34: Settings → "See the intro again" · v33: welcome research laurel, plan "moments a year with your people", personal paywall (saved v32 = /saved-v32/) · v32: Opal-style Screen Time primer (saved v31 = /saved-v31/) · v31: logo only on Home like Cal AI (saved v30 in Archive) · v30: app icon = 10d "head rising" · v29: wordmark app icon + removed the icon→Safari "Test mode" screen · v28: idea options as Cal AI-style rows (v27 tiles looked "AI") · v27: back to the regular v25 flow (v26 test flow removed) + clean idea tiles on "What makes you feel good?" · v25: home-screen icon hands over to Safari (one shared data store with the Shortcuts pause) · v24: icon opens in Safari so it shares data with the Shortcuts pause · v23: explain Safari vs home-screen data in test mode · v22: Shortcuts test mode counts as connected; pause opens even if app was already open · v21: no fake vibration visuals on hold · v20: welcome demo calm again; vibration on press-and-hold · v19: seamless bottom (fade to solid colour) · v18: strip painted to match, auto-advance without Continue, tap/ripple/buzz demo · v17: docked tab bar, real screen height on iPhone · v16: Screen Time permission step; Shortcuts = test mode in Settings · v15: minimal welcome with rotating reasons · v14: restore link on welcome · v13: new welcome with live demo, no background lines, bottom strip fix · v12: no Shabbat, verified stats, "Not now", rising chart, people preview · v10: English default + Hebrew (RTL), iOS-style navigation (push/pop, edge swipe, haptics, sheets you can drag down),
   Apple Screen Time style picker with real app icons, demo home screen, tab bar (Today / Progress / Settings), one onboarding progress bar */
/* earlier v9: Cal AI onboarding patterns · v8: any app + categories · v7: Steven Cravotta blueprint · design: Passion Finder + Stress glass */
:root{
  --ink:#231A14; --w90:rgba(255,255,255,.92); --w70:rgba(255,255,255,.78);
  --glass:rgba(255,255,255,.17); --gline:rgba(255,255,255,.32);
  --amber:#FFC979; --ease:cubic-bezier(.22,.8,.26,1);
  --photo:url("https://images.unsplash.com/photo-1788094667065-2ffdca7a66fc?w=900&q=80");
  --photoNight:url("https://images.unsplash.com/photo-1581491608595-6dadce30433a?w=900&q=80");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;color:#fff;font-family:Heebo,"Noto Sans Arabic",-apple-system,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;overscroll-behavior:none;background:#B9683A;overflow:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(70% 40% at 90% 0%,#A7A3B4 0%,rgba(167,163,180,0) 70%),
   radial-gradient(60% 35% at 0% 18%,#7A5546 0%,rgba(122,85,70,0) 70%),
   radial-gradient(75% 45% at 40% 62%,#D97A2E 0%,rgba(217,122,46,0) 70%),
   radial-gradient(55% 35% at 100% 80%,#C7642A 0%,rgba(199,100,42,0) 70%),
   radial-gradient(70% 35% at 0% 100%,#7A5E7C 0%,rgba(122,94,124,0) 70%),
   linear-gradient(175deg,#7E5C52 0%,#A6663F 35%,#BF6A28 62%,#8F5E52 100%)} /* v12: a little deeper so white text passes contrast */
/* v13: decorative petal lines removed (they competed with text; top apps use clean backgrounds).
   iOS home-screen apps can leave a strip under the page, so the gradient runs past the bottom and the page colour matches it. */
html{background:#8F5E52}
.mesh{bottom:-140px}
.mock{width:min(46vw,19vh,190px);aspect-ratio:9/18.6;margin:0 auto;border-radius:32px;padding:6px;background:#140d0a;box-shadow:0 34px 60px -22px rgba(40,10,0,.75),inset 0 0 0 1.5px rgba(255,255,255,.14)}
.mscreen{height:100%;border-radius:27px;overflow:hidden;position:relative;background:linear-gradient(175deg,#7E5C52 0%,#B5622A 55%,#8F5E52 100%);display:flex;flex-direction:column;align-items:center;padding:28px 9px 10px;text-align:center}
.mscreen::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:30%;height:13px;border-radius:8px;background:#000}
.mchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding-inline:3px 8px;border-radius:10px;background:rgba(0,0,0,.25);font-size:8.5px;font-weight:600;white-space:nowrap}
.mcirc{position:relative;width:74%;aspect-ratio:1;margin-top:10px}
.mcirc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.marc{stroke-dasharray:820;stroke-dashoffset:820}
.mph{position:absolute;inset:9%;border-radius:50%;background:var(--photo) center/cover;display:grid;place-items:center;transition:background .4s}
.mph svg.i{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;color:#fff;stroke-width:1.6}
/* demo phone: a finger taps "Not now", a ripple spreads and the phone buzzes (shows the haptic tap) */
.mock{position:relative}
.mfinger{position:absolute;left:58%;bottom:6px;font-size:30px;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));z-index:3}
.mrip{position:absolute;left:50%;bottom:34px;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none;z-index:2}
.go .mfinger{animation:mfinger 3.4s ease-in-out both}
.go .mrip{animation:mrip 3.4s ease-out both}
.mock::before,.mock::after{content:"";position:absolute;top:58%;width:10px;height:26px;border:2.5px solid rgba(255,255,255,.85);border-top-color:transparent;border-bottom-color:transparent;border-radius:50%;opacity:0}
.mock::before{left:-16px;border-right-color:transparent}.mock::after{right:-16px;border-left-color:transparent}
@keyframes mfinger{0%,52%{opacity:0;transform:translate(30px,40px)}66%{opacity:1;transform:translate(0,4px)}82%{transform:translate(0,4px)}86%{transform:translate(0,9px) scale(.92)}92%{opacity:1;transform:translate(0,4px)}100%{opacity:0;transform:translate(10px,20px)}}
@keyframes mrip{0%,85%{opacity:0;transform:scale(.4)}88%{opacity:.9}100%{opacity:0;transform:scale(4.5)}}
@keyframes mbuzz{0%,85%,95%,100%{transform:none}87%{transform:translateX(-2px) rotate(-.6deg)}89%{transform:translateX(2px) rotate(.6deg)}91%{transform:translateX(-2px)}93%{transform:translateX(1px)}}
@keyframes mwaves{0%,85%{opacity:0;transform:scale(.6)}89%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
/* demo home screen: a finger shows where to tap; done screen: a success burst */
.sbapp{position:relative}
.sbfinger{position:absolute;left:58%;top:42px;font-size:30px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));animation:sbfinger 1.8s ease-in-out infinite;z-index:3}
.sbapp:first-child::after{content:"";position:absolute;top:0;left:50%;width:60px;height:60px;margin-left:-30px;border-radius:15px;border:2px solid #fff;animation:sbring 1.8s ease-out infinite;pointer-events:none}
@keyframes sbfinger{0%,100%{transform:translate(6px,8px)}45%{transform:translate(0,0) scale(.9)}55%{transform:translate(0,0) scale(.9)}}
@keyframes sbring{0%,40%{opacity:0;transform:scale(.9)}50%{opacity:.9}100%{opacity:0;transform:scale(1.5)}}
#done.on .round{animation:donePop .6s cubic-bezier(.2,1.4,.4,1) both;position:relative}
#done.on .round::before,#done.on .round::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.9);animation:doneRing 1.2s ease-out .15s both}
#done.on .round::after{animation-delay:.4s}
@keyframes donePop{from{transform:scale(.4);opacity:0}}
@keyframes doneRing{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
.go .marc{animation:marc 3.4s ease-in-out both}.go .mph{animation:mbreath 3.4s ease-in-out both}.go .mbtn{animation:mtap 3.4s ease-in-out both}
.go .mtitle,.go .midea{animation:rise .45s var(--ease) both}
.wh{min-height:2.5em}
.rot{display:inline-block;color:#FFE2B8}
.rot.in{animation:rotIn .5s var(--ease) both}
@keyframes rotIn{from{opacity:0;transform:translateY(60%)}}
.mtitle{font-size:12.5px;font-weight:700;margin-top:9px;line-height:1.2}
.midea{font-size:9px;margin-top:4px;padding:5px 7px;border-radius:8px;background:rgba(255,255,255,.18);line-height:1.25}
.mgrow{flex:1}
.mbtn{width:100%;height:24px;border-radius:12px;background:#fff;color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center}
.mbtn2{font-size:8.5px;opacity:.85;margin-top:5px}
@keyframes marc{0%{stroke-dashoffset:820}65%,100%{stroke-dashoffset:0}}
@keyframes mbreath{0%,100%{transform:scale(.9)}45%{transform:scale(1)}}
@keyframes mtap{0%,78%,100%{transform:scale(1)}86%{transform:scale(.9);background:#E8F5EC}}
.top.wtop{grid-template-columns:1fr auto}.wtop .brand{text-align:left;white-space:nowrap}[dir=rtl] .wtop .brand{text-align:right}
.proof{display:flex;gap:8px;align-items:flex-start;justify-content:center;font-size:13.5px;line-height:1.4;color:var(--w90);margin:12px auto 0;max-width:330px;text-align:start}
.proof svg{width:18px;height:18px;flex-shrink:0;padding:2px;border-radius:50%;background:#34C759;color:#fff;stroke-width:3}
.mesh::after{display:none;content:"";position:absolute;inset:0;opacity:.2;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 800' preserveAspectRatio='xMidYMid slice'><g fill='none' stroke='white' stroke-width='.8'><ellipse cx='200' cy='420' rx='150' ry='330'/><ellipse cx='200' cy='420' rx='150' ry='330' transform='rotate(40 200 420)'/><ellipse cx='200' cy='420' rx='150' ry='330' transform='rotate(-40 200 420)'/><circle cx='200' cy='420' r='360'/></g></svg>") center/cover}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
[dir=ltr] svg.fl{transform:scaleX(-1)}

/* screens + iOS-like transitions */
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch}
.screen.on{display:flex;z-index:2}
.screen.out{display:flex;pointer-events:none;z-index:1}
.screen.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 80px)}
/* v17: iPhone home-screen apps can report a viewport shorter than the screen (orange strip at the bottom).
   --H is the real screen height, set from JS; every full-screen layer uses it. */
.screen,.sheet{bottom:auto!important;height:var(--H,100%)}
/* v19: the background fades to one solid colour at the bottom, and the strip below the app uses that same colour, so it looks continuous */
html,body{background:#A15F40}
.mesh::before{content:"";position:absolute;left:0;right:0;top:calc(var(--H,100vh) - 170px);bottom:0;background:linear-gradient(rgba(161,95,64,0),#A15F40 170px);z-index:1}
html.darkbg,html.darkbg body{background:#24120A!important}
html.tabsbg,html.tabsbg body{background:#5C341E}
.shortvp .screen{padding-bottom:20px}
.shortvp .screen.tabbed{padding-bottom:80px}
.shortvp #tabbar{top:calc(var(--H,100vh) - 58px);height:58px;padding-bottom:0}
.mesh{bottom:auto!important;height:calc(var(--H,100vh) + 140px)}
.screen>*{flex-shrink:0;position:relative}
.screen>.grow{flex:1;flex-shrink:1}
@keyframes inFromEnd{from{opacity:0;transform:translateX(44px)}}
@keyframes inFromStart{from{opacity:0;transform:translateX(-44px)}}
@keyframes outToStart{to{opacity:0;transform:translateX(-30px)}}
@keyframes outToEnd{to{opacity:0;transform:translateX(30px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.35)}}
@keyframes upIn{from{opacity:0;transform:translateY(40px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
[dir=ltr] .a-push-in,[dir=rtl] .a-pop-in{animation:inFromEnd .42s var(--ease) .1s both}
[dir=rtl] .a-push-in,[dir=ltr] .a-pop-in{animation:inFromStart .42s var(--ease) .1s both}
[dir=ltr] .a-push-out,[dir=rtl] .a-pop-out{animation:outToStart .18s ease both}
[dir=rtl] .a-push-out,[dir=ltr] .a-pop-out{animation:outToEnd .18s ease both}
.a-fade-in{animation:fadeIn .28s ease both}.a-fade-out{display:none!important}.a-zoom-out,.a-up-out{animation:fadeOut .16s ease both}
.a-zoom-in{animation:zoomIn .5s cubic-bezier(.2,.9,.25,1) both}
.a-up-in{animation:upIn .45s var(--ease) both}
.a-push-in>*,.a-up-in>*{animation:rise .5s var(--ease) both}
.a-push-in>:nth-child(2),.a-up-in>:nth-child(2){animation-delay:.03s}.a-push-in>:nth-child(3),.a-up-in>:nth-child(3){animation-delay:.06s}
.a-push-in>:nth-child(4),.a-up-in>:nth-child(4){animation-delay:.09s}.a-push-in>:nth-child(5),.a-up-in>:nth-child(5){animation-delay:.12s}
.a-push-in>:nth-child(n+6),.a-up-in>:nth-child(n+6){animation-delay:.15s}

/* type */
.brand{font-family:Unbounded,Heebo,sans-serif;font-weight:600;font-size:26px;line-height:1;letter-spacing:.5px;text-align:center;direction:ltr;text-transform:uppercase}
.brand.sm{font-size:16px;letter-spacing:1px}
h1.t{font-size:30px;line-height:1.18;font-weight:600;letter-spacing:-.4px;text-align:center;margin-top:18px;text-shadow:0 1px 14px rgba(80,30,0,.25)}
.d{font-size:16.5px;line-height:1.5;text-align:center;color:var(--w90);margin:10px auto 0;max-width:330px}
.lbl{font-size:15px;font-weight:600;margin:24px 0 10px;color:#fff;display:flex;align-items:baseline;gap:6px}
.lbl small{font-weight:400;color:var(--w70);font-size:14px}
.lbl .end{margin-inline-start:auto;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.num{font-weight:300;letter-spacing:-2px;line-height:.95}
.num small{font-size:.32em;letter-spacing:0;font-weight:400;opacity:.8;margin-inline-start:4px}

/* top bar */
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:48px;gap:8px}
.top>:last-child{justify-self:end}
.gbtn{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--gline);display:grid;place-items:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s}
.gbtn:active{transform:scale(.9)}
.gbtn svg{width:20px;height:20px}
.obbar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;margin:0 6px}
.obbar b{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .5s var(--ease)}
.langbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--glass);border:1px solid var(--gline);font-size:14.5px;font-weight:500;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.langbtn svg{width:18px;height:18px}

/* glass surfaces */
.glass{background:var(--glass);border:1px solid var(--gline);border-radius:26px;backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2)}
.solid{background:#FFF;color:var(--ink);border-radius:26px}
.rowg{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--gline);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);margin-bottom:8px;min-height:64px}
.rowg .tx{flex:1;min-width:0}
.rowg .tx b{display:block;font-size:17px;font-weight:500}
.rowg .tx small{display:block;font-size:14px;color:var(--w90);margin-top:1px;line-height:1.35}
.rowg .ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex-shrink:0}
.rowg .ic svg{width:19px;height:19px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:9px}
.bar b{display:block;height:100%;width:var(--w);background:#fff;border-radius:3px}
.time{border:0;background:#fff;color:var(--ink);padding:8px 10px;border-radius:12px;font-weight:600;font-size:16px;min-width:78px;text-align:center}
.tgl{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.3);position:relative;transition:.25s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.25s var(--ease)}
.tgl.on{background:#34C759}
.tgl.on::after{inset-inline-start:23px}

/* bubbles */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;padding:6px 0}
.bub{--s:96px;width:var(--s);height:var(--s);border-radius:50%;margin:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:500;line-height:1.15;padding:8px;position:relative;
  background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s var(--ease),background .2s}
.bub:active{transform:scale(.94)}
.bub.on{background:#FFF8F1;color:var(--ink);border-color:#fff;box-shadow:0 10px 24px -12px rgba(80,30,0,.45);z-index:1}
.bub.photo{background:center/cover;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);border:3px solid #fff;justify-content:flex-end;padding-bottom:12px}
.bub .x{position:absolute;top:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff}
.bub .x svg{width:13px;height:13px;stroke-width:2.6}
.bub.add{border:1.5px dashed rgba(255,255,255,.7);background:transparent}
.bub small{font-size:12.5px;font-weight:400;opacity:.85;margin-top:2px}
.bub svg.i{width:22px;height:22px;margin-bottom:4px}

/* buttons */
.pill{display:flex;align-items:center;justify-content:center;gap:10px;flex:1;width:100%;height:58px;border-radius:18px;font-size:17.5px;font-weight:600;transition:transform .15s var(--ease),opacity .2s}
.pill:active{transform:scale(.97)}
.pill.white{background:#fff;color:var(--ink);box-shadow:0 10px 26px -14px rgba(70,25,0,.6)}
.pill.glassb{background:rgba(255,255,255,.22);border:1px solid var(--gline);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pill.ink{background:var(--ink);color:#fff}
.pill.link{height:46px;color:var(--w90);font-weight:500;font-size:16px}
.pill[disabled]{opacity:.4}
.pill svg{width:20px;height:20px}
.duo{display:flex;gap:10px;padding-top:16px}
.foot{text-align:center;font-size:14.5px;margin-top:12px;color:var(--w90)}

/* photo circle with arc */
.circ{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:0 auto}
.circ .ph{position:absolute;inset:14px;border-radius:50%;background:var(--photo) center/cover;box-shadow:0 24px 50px -18px rgba(70,25,0,.6);transition:transform 3s cubic-bezier(.45,0,.35,1)}
.circ svg.arc{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) scaleX(-1)}
.circ svg.arc circle{fill:none;stroke-width:2}
.circ svg.arc .bgc{stroke:rgba(255,255,255,.25)}
.circ svg.arc .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.round{width:96px;height:96px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;margin:0 auto;box-shadow:0 16px 36px -14px rgba(70,25,0,.55);font-size:16px;font-weight:600;line-height:1.1;text-align:center;transition:transform .15s}
.round:active{transform:scale(.93)}
.round svg{width:30px;height:30px;color:#D9652A}
.round.big{width:118px;height:118px}

/* tiles + gauge */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:30px;padding:18px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .h{font-size:15.5px;font-weight:500}
.tile .num{font-size:52px}
.tile small.s{font-size:12.5px;opacity:.75;line-height:1.35}
.solid .h{color:#5E4E42}
.gauge{position:relative;padding:20px 18px 18px;border-radius:34px;margin-top:14px;text-align:center}
.gauge .h{display:flex;justify-content:space-between;align-items:baseline;font-size:15.5px;font-weight:500;color:var(--w90)}
.gauge .num{font-size:84px;margin-top:4px;text-align:start}
.gauge svg.g{width:100%;max-width:300px;height:auto;display:block;margin:-6px auto 0}
.gauge .heart{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
.gauge .heart:active{transform:translateX(-50%) scale(.92)}
.gauge .gl{display:flex;justify-content:space-between;font-size:13px;color:var(--w90);margin-top:-6px;padding:0 10px}
.week{display:flex;gap:6px;align-items:flex-end;height:120px;padding:6px 0 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week em{font-style:normal;font-size:13px;font-weight:600;min-height:16px}
.week i{width:100%;max-width:26px;border-radius:13px;background:rgba(255,255,255,.22);flex:1;position:relative;overflow:hidden}
.week i::after{content:"";position:absolute;inset:auto 0 0;height:var(--h);background:#fff;border-radius:13px;transition:height .6s var(--ease)}
.week span{font-size:13px;color:var(--w90)}
.week .today span{color:#fff;font-weight:700}
.status{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:#FFF8F1;color:var(--ink);margin-top:12px}
.status .tx{flex:1}.status b{display:block;font-size:16px;font-weight:600}.status small{font-size:14px;color:#6B5B4E}
.status .go{height:40px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap}
.streak{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:20px;background:rgba(255,255,255,.2);border:1px solid var(--gline);font-size:16px;justify-self:start}
.streak svg{width:18px;height:18px;color:#FFD08A;fill:#FFD08A;stroke:none}
.miles{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
.miles div{flex:1;text-align:center;font-size:12.5px;color:var(--w90)}
.miles i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 5px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);font-style:normal;font-weight:600;font-size:16px}
.miles .ok i{background:#fff;color:#D9652A;border:0}

/* photos + fields */
/* v28: idea options as Cal AI-style rows (full width, line icon in a circle, selected row turns solid) */
.itiles{display:flex;flex-direction:column;gap:10px}
.itile{display:flex;align-items:center;gap:14px;width:100%;height:60px;padding-inline:12px 16px;border-radius:18px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;text-align:start;transition:transform .15s,background .2s,color .2s}

.itile .ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;transition:background .2s}
.itile .ico svg{width:19px;height:19px;stroke-width:2}
.itile b{flex:1;font-weight:600}
.itile.on{background:#fff;color:var(--ink)}
.itile.on .ico{background:var(--ink,#2A1A10);color:#fff}
/* v31: logo like Cal AI: only on Home (mark + name, top-left); onboarding, paywall and other tabs have no logo */
.htop{display:flex;justify-content:space-between;align-items:center}
.hbrand{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:-.2px}
.hmark{width:34px;height:18px;display:block;color:#FFF3E4}
.hword{font-family:Unbounded,Heebo,sans-serif;font-weight:600;font-size:19px;letter-spacing:.6px;text-transform:uppercase;direction:ltr}
.ptitle{text-align:start!important;font-size:32px!important;margin-top:6px!important}
.req{color:#E0702F;font-style:normal;font-weight:700;margin-inline-start:2px}
.pneed{text-align:center;font-size:14px;color:#B4501C;margin-top:16px;min-height:20px;font-weight:500}
.sf.need{border-color:#E0702F;box-shadow:0 0 0 3px rgba(224,112,47,.18)}
/* v38: pause = the person's photo full screen + a glowing breathing ring (in 4s / out 4s) + soft breath sound with mute */
#pause{padding-top:calc(env(safe-area-inset-top) + 8px)}
.pbg{position:fixed!important;inset:-4%;background:var(--photo) center/cover;z-index:0;animation:kb 18s ease-in-out infinite alternate}
.pbg.blur{filter:blur(28px) saturate(1.1);inset:-10%;animation:none;opacity:.9}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.pshade{position:fixed!important;inset:0 0 -2px 0;z-index:0;pointer-events:none;background:linear-gradient(rgba(36,18,10,.55),rgba(36,18,10,.12) 28%,rgba(36,18,10,.2) 55%,rgba(36,18,10,.85) 84%,#24120A 99%)}
.ptop{grid-template-columns:48px 1fr 48px}
.ptop .pchip{justify-self:center;max-width:100%;overflow:hidden;white-space:nowrap}
.ptop .gbtn{background:rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bring{position:relative;width:min(60vw,240px);aspect-ratio:1;margin:0 auto;border-radius:50%;transform:scale(.68);transition:transform 4s cubic-bezier(.45,0,.55,1),box-shadow 4s;
 border:2px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.45),inset 0 0 22px rgba(255,255,255,.25),0 0 50px rgba(255,214,170,.2);
 backdrop-filter:blur(3px) brightness(1.12);-webkit-backdrop-filter:blur(3px) brightness(1.12)}
.bring.inh{transform:scale(1);box-shadow:0 0 34px rgba(255,255,255,.75),inset 0 0 40px rgba(255,255,255,.4),0 0 110px rgba(255,214,170,.45)}
.bring i{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,rgba(255,255,255,.95) 82%,transparent 100%);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 5s linear infinite;filter:blur(1.5px)}
.bring b{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(rgba(255,240,220,.28),transparent 70%);opacity:.4;transition:opacity 4s}
.bring.inh b{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#pause .cue{font-size:40px;font-weight:700;letter-spacing:-.5px;text-align:center;min-height:52px;margin-top:22px;text-shadow:0 2px 20px rgba(0,0,0,.35);transition:opacity .6s}
#pause .cue span{display:inline-block;opacity:0;animation:cin .5s forwards}
@keyframes cin{to{opacity:1}}
#pause.ready .cue{font-size:20px;min-height:28px;margin-top:14px;opacity:.85}
#pause .msg{opacity:0;transform:translateY(10px);transition:all .9s var(--ease);text-align:center}
#pause .msg.on{opacity:1;transform:none}
#pause .title{font-size:28px;font-weight:700;line-height:1.18;margin-top:8px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
#pause .idea{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:20px;max-width:330px;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25)}
#pause .idea small{display:block;font-size:13px;font-weight:600;color:#FFD9A8;margin-bottom:2px}
#pause .idea span{font-size:18px;font-weight:500;line-height:1.35}
.pacts{display:flex;flex-direction:column;align-items:stretch;opacity:0;pointer-events:none;transform:translateY(12px);transition:all .7s var(--ease)}

.pacts .pill{flex:none;height:56px;width:100%}.pacts .pill.link{height:48px;color:rgba(255,255,255,.85);font-weight:500}.pacts{padding-bottom:6px}
/* open-for wheel (like the iOS timer picker) */
.wheel{position:relative;height:240px;margin:0 10px}
.wband{position:absolute;left:0;right:0;top:96px;height:48px;border-radius:24px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);pointer-events:none}
.wlist{position:relative;height:240px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wlist::-webkit-scrollbar{display:none}
.wlist div{height:48px;display:grid;place-items:center;scroll-snap-align:center;font-size:20px;font-weight:500;color:rgba(255,255,255,.5);transition:color .15s,font-size .15s}

/* home: open session bar + quiet times */
.sess{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 12px 12px 14px;border-radius:22px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,236,214,.95));color:var(--ink);box-shadow:0 12px 26px -16px rgba(60,20,0,.6)}
.sess .tx{flex:1;display:flex;flex-direction:column}.sess b{font-size:16px}.sess small{font-size:13.5px;color:#7A5A44;font-variant-numeric:tabular-nums}
.sess button{height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;flex:none}
.rules{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rules::-webkit-scrollbar{display:none}#home .rules{margin-bottom:80px}
.rule{flex:none;width:152px;scroll-snap-align:start;text-align:start;padding:14px;border-radius:22px;display:flex;flex-direction:column;gap:6px}
.rule .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.rule .ri svg{width:20px;height:20px}
.rule .st{align-self:flex-start;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:10px;background:rgba(0,0,0,.18);margin-top:6px}
.rule .st.now{background:#FFF8F1;color:var(--ink)}
.rule b{font-size:16.5px;line-height:1.2}.rule small{font-size:13.5px;opacity:.85}
.rule.off{opacity:.75}
.acard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px;border-radius:22px}
.acard .ai{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}.acard .ai svg{width:22px;height:22px}
.acard .tx{flex:1;display:flex;flex-direction:column}.acard b{font-size:16px}.acard small{font-size:13.5px;opacity:.85;line-height:1.35}
.acard button{height:38px;padding:0 14px;border-radius:19px;background:#FFF8F1;color:var(--ink);font-weight:600;font-size:14.5px;flex:none}
#anyway.wait{opacity:.55;font-variant-numeric:tabular-nums}
/* day-of-rest sheet */
.rsrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.rsrow span{flex:1;font-weight:600}
.rsrow select,.rsrow input{height:44px;border-radius:12px;border:1px solid #E6D8CA;background:#fff;padding:0 10px;font:inherit;font-size:16px;color:var(--ink)}
/* v39: moments on Progress, photo on Done, people card + switches in Settings */
.mhero{padding:18px 20px;border-radius:26px;text-align:center;margin-top:14px}
.mhero small{display:block;font-size:14.5px;font-weight:600;color:#FFE2B8}
.mhero .num{font-size:60px;line-height:1.05;margin-top:4px}
.mhero span{display:block;font-size:15px;opacity:.9;margin-top:4px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;margin-top:10px}
.mrow.solid{color:var(--ink)}
.mmp{width:54px;height:54px;border-radius:50%;flex:none;background:#E9D6C4 center/cover;border:2px solid #fff;display:grid;place-items:center}
.mmp.self{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}.mmp.self svg{width:24px;height:24px}
.mrow .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow .tx b{font-size:17px}.mrow .tx small{font-size:13px;opacity:.75}
.mbar{display:block;height:6px;border-radius:3px;background:rgba(80,40,10,.12);margin-top:6px;overflow:hidden}
.mbar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#E8833A,#D9652A)}
.mrow .nx{font-size:12px!important;margin-top:2px}
.mw{display:flex;flex-direction:column;align-items:center;flex:none;min-width:54px}
.mw b{font-size:28px;line-height:1}.mw small{font-size:11.5px;opacity:.7}
.dph{width:150px;height:150px;border-radius:50%;margin:0 auto;background:center/cover;border:4px solid #fff;box-shadow:0 20px 40px -18px rgba(60,20,0,.6);animation:dpop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes dpop{from{transform:scale(.6);opacity:0}}
#dMom{font-size:16px;font-weight:600;color:#FFE2B8;margin-top:10px;text-align:center}
.pcard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;margin-top:14px;padding:14px 16px;border-radius:24px;background:#FFF8F1;color:var(--ink)}
.pcard .avs{justify-content:flex-start}.pcard .avs i{width:46px;height:46px}
.pcard .tx{flex:1;display:flex;flex-direction:column}.pcard b{font-size:18px}.pcard small{font-size:13.5px;color:#7A6A5D}
.pcard .addp{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.sw{width:50px;height:30px;border-radius:15px;background:#D9CFC5;position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:2px;inset-inline-start:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.sw.on{background:#34A853}.sw.on i{inset-inline-start:22px}
/* v35: Home week strip (Cal AI pattern) */
.wstrip{display:flex;justify-content:space-between;margin:10px -4px 4px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:22px}

.avs{display:flex;justify-content:center}

.phero .avs{margin-bottom:8px}
/* v32: Opal-style Screen Time primer: a copy of Apple's alert, glowing frame, arrow to "Continue", privacy line */
.optitle{font-size:27px!important;line-height:1.2;margin-top:18px;padding:0 6px}
.opwrap{position:relative;width:min(300px,82vw);margin:0 auto}
.opring{position:absolute;inset:-14px;border-radius:40px;border:1.5px solid rgba(255,248,241,.35);pointer-events:none}
.opring.r2{inset:-30px;border-radius:52px;border-color:rgba(255,248,241,.6);box-shadow:0 0 40px rgba(255,214,170,.35),inset 0 0 30px rgba(255,214,170,.15);animation:opGlow 2.6s ease-in-out infinite}

.opcard{position:relative;background:rgba(250,246,242,.97);color:#000;border-radius:30px;padding:22px 18px 16px;text-align:start;font-family:-apple-system,system-ui,Heebo,"Noto Sans Arabic",sans-serif;box-shadow:0 24px 50px -20px rgba(60,20,0,.55)}

.opbtns .c{background:rgba(120,120,128,.18);color:#000}
.opbtns .b{background:#3D9BF5;color:#fff}
.oparrow{position:absolute;top:calc(100% + 6px);inset-inline-start:6%;width:96px;height:104px;fill:none;stroke:#FFF8F1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;animation:bob 1.3s ease-in-out infinite}

[dir=rtl] .oparrow{animation:none}
.opsafe{display:flex;gap:8px;align-items:flex-start;justify-content:center;text-align:center;font-size:15px;line-height:1.4;color:var(--w90,#fff);max-width:330px;margin:0 auto}
.opsafe svg{width:18px;height:18px;flex:none;margin-top:2px}
.lmh{font-size:22px;font-weight:700;margin:6px 0 4px}
.lmv{margin:12px 0 0;max-width:none}.lmv svg{color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.field{width:100%;height:54px;border-radius:16px;border:1px solid var(--gline);background:rgba(255,255,255,.22);padding:0 16px;font-size:17px;outline:none;color:#fff}

.cust button svg{width:14px;height:14px}

/* ---------- pause ---------- */
let firstRun=false,curApp='instagram',curPerson=null,pendingApp=null,isTest=false,timers=[];
async function startPause(app,test,anim){curApp=app||'instagram';isTest=!!test;curPerson=null;
 const tries=st.log.filter(e=>e.app===curApp&&dayKey(new Date(e.t))===dayKey(new Date())).length+1;
 const m=mode();let title,idea,pic,greet,lbl=t('instead_lbl');
 if(m==='family'){const p=pick(st.people);curPerson=p.id;const r=REL[p.rel];title=t('PT')[r.k](p.name,r.g);idea=pick(t('PI')[r.k])(p.name,r.g);pic=pick(p.pics)||pick(st.general);greet=t('g_family')}
 else if(m==='morning'){title=t('gm');idea=pick(t('MORNING'));pic=pick(st.general)||pick(st.people.flatMap(p=>p.pics));greet=t('g_morning')}
 else if(m==='night'){const n=pick(t('NIGHT'));title=n[0];idea=n[1];pic=pick(st.general)||pick(st.people.flatMap(p=>p.pics));greet=t('g_night');lbl=t('now_lbl')}
 else{title=pick(t('DAY'));const I=t('IDEAS');const pool=[...st.cats.flatMap(c=>I[c]||[]),...st.custom,...st.custom];idea=pick(pool.length?pool:I.breath);pic=pick([...st.general,...st.people.flatMap(p=>p.pics)]);greet=t('g_before',appName(curApp))}
 if(!curPerson&&pic){const o=st.people.find(p=>p.pics.includes(pic));if(o)curPerson=o.id}
 if(!isTest)greet+=t('g_nth',tries);
 const src=await photo(pic)||'';const bg=src?`url(${src})`:(m==='night'?'var(--photoNight)':'var(--photo)');
 $('pPhoto').style.backgroundImage=bg;sndIcon();
 $('pGreet').innerHTML=(APPS[curApp]?appIcon(curApp,26):'')+`<span>${esc(greet)}</span>`;$('pTitle').textContent=title;
 $('pIdea').textContent=idea;$('pIdeaLbl').textContent=lbl;
 $('anyway').textContent=t('anyway',appName(curApp));strictArm(m);
 $('pMsg').classList.remove('on');
 go('pause',{anim:anim||'fade'});runBreath()}

function choose(kind){timers.forEach(clearTimeout);clearInterval(breathI);sndStop();if(kind==='open'){go('openfor',{anim:'up'});return}if(!isTest){st.log.push({t:Date.now(),k:kind,app:curApp,p:curPerson});st.log=st.log.slice(-2000);save()}
 if(kind==='here'){const today=countDay(new Date());$('dTitle').innerHTML=t('d_title');
  const p=st.people.find(x=>x.id===curPerson);$('dSub').textContent=p?t('d_person',p.name):(isTest?t('d_test'):t('d_nth',today.here||1));
  const after=firstRun?'perm':'home';
  $('dFoot').textContent=isTest?(firstRun?t('d_first'):t('d_home')):t('d_close');go('done',{anim:'fade'});doneMoment().then(()=>{$('dChk').style.display=$('dPh').style.display==='none'?'':'none'});hap();setTimeout(hap,140);if(isTest)doneT=setTimeout(()=>{firstRun=false;go(after,{anim:'up'})},2600);return}
 if(isTest){toast(t('t_noopen'));const a=firstRun?'perm':'home';firstRun=false;go(a,{anim:'up'});return}
 const u=(APPS[curApp]||{}).u;if(!u){toast(t('t_opennow'));return}
 location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Look Up Pass')+'&input=text&text='+encodeURIComponent(u)}

/* ---------- v38: breathing pause, breath sound, open-for-X-minutes, open session, quiet times ---------- */
function setCue(s){const c=$('cue');c.innerHTML=[...s].map((ch,i)=>`<span style="animation-delay:${i*45}ms">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('')}
function runBreath(){timers.forEach(clearTimeout);clearInterval(breathI);const s=$('pause'),r=$('bRing');
 s.classList.remove('ready');$('pMsg').classList.remove('on');r.classList.remove('inh');
 let n=0;const cycle=()=>{r.classList.add('inh');setCue(t('cue_in'));snd(1);hap();
  timers.push(setTimeout(()=>{r.classList.remove('inh');setCue(t('cue_out'));snd(0)},4000));n++};
 requestAnimationFrame(()=>requestAnimationFrame(cycle));breathI=setInterval(cycle,8000);
 const X=((st.breaths||1)-1)*8000;timers=[setTimeout(()=>{$('pMsg').classList.add('on')},7600+X),setTimeout(()=>{s.classList.add('ready')},8400+X)]}
let breathI=null;
/* soft "breath" sound: filtered noise that swells on the in-breath and fades on the out-breath (no audio files) */
let AC=null,nGain=null,nFilt=null;
function sndInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
 const src=AC.createBufferSource();src.buffer=b;src.loop=true;nFilt=AC.createBiquadFilter();nFilt.type='lowpass';nFilt.frequency.value=500;nGain=AC.createGain();nGain.gain.value=0;src.connect(nFilt);nFilt.connect(nGain);nGain.connect(AC.destination);src.start()}catch(e){AC=null}}
function snd(inb){if(st.mute||!$('pause').classList.contains('on'))return;sndInit();if(!AC)return;if(AC.state==='suspended')AC.resume();const t0=AC.currentTime;
 nGain.gain.cancelScheduledValues(t0);nFilt.frequency.cancelScheduledValues(t0);nGain.gain.setValueAtTime(nGain.gain.value,t0);nFilt.frequency.setValueAtTime(nFilt.frequency.value,t0);
 nGain.gain.linearRampToValueAtTime(inb?0.5:0.04,t0+4);nFilt.frequency.linearRampToValueAtTime(inb?1400:380,t0+4)}
function sndStop(){if(AC&&nGain){nGain.gain.cancelScheduledValues(AC.currentTime);nGain.gain.setTargetAtTime(0,AC.currentTime,.15)}}
function sndIcon(){$('pSnd').innerHTML=st.mute?'<svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>':'<svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'}
function toggleSnd(){st.mute=!st.mute;save();sndIcon();hap();if(st.mute)sndStop();else{sndInit();if(AC)AC.resume();snd($('bRing').classList.contains('inh')?1:0)}}
document.addEventListener('pointerdown',()=>{if(AC&&AC.state==='suspended')AC.resume()},{passive:true});

/* open for X minutes: you choose the time, Look Up stays quiet until it ends, then pauses again */
const OF_MIN=[1,2,3,5,10,15,20,30,45,60];let ofI=3;
function renderOpenFor(){$('ofApp').innerHTML=(APPS[curApp]?appIcon(curApp,26):'')+`<span>${esc(appName(curApp))}</span>`;$('ofBg').style.backgroundImage=$('pPhoto').style.backgroundImage;
 const w=$('ofWheel');w.innerHTML='<div class="sp"></div><div class="sp"></div>'+OF_MIN.map((m,i)=>`<div data-i="${i}" onclick="ofScroll(${i},true)">${t('of_min',m)}</div>`).join('')+'<div class="sp"></div><div class="sp"></div>';
 ofI=OF_MIN.indexOf(st.lastMin||5);if(ofI<0)ofI=3;requestAnimationFrame(()=>{w.scrollTop=ofI*48;ofMark()});
 w.onscroll=()=>{const i=Math.max(0,Math.min(OF_MIN.length-1,Math.round(w.scrollTop/48)));if(i!==ofI){ofI=i;ofMark();hap()}}}
function ofScroll(i){$('ofWheel').scrollTo({top:i*48,behavior:'smooth'})}
function ofMark(){[...$('ofWheel').querySelectorAll('[data-i]')].forEach(d=>d.classList.toggle('on',+d.dataset.i===ofI));$('ofGo').textContent=t('of_go',OF_MIN[ofI])}
function openFor(){const m=OF_MIN[ofI];st.lastMin=m;hap();
 if(!isTest){st.log.push({t:Date.now(),k:'open',app:curApp,p:curPerson});st.log=st.log.slice(-2000)}
 st.session={app:curApp,until:Date.now()+m*60000,min:m};save();sndStop();
 if(isTest){toast(t('of_demo',appName(curApp),m));const a=firstRun?'perm':'home';firstRun=false;go(a,{anim:'up'});return}
 openApp(curApp)}
function openApp(app){const u=(APPS[app]||{}).u;if(!u){toast(t('t_opennow'));go('home',{anim:'fade'});return}
 location.href='shortcuts://run-shortcut?name='+encodeURIComponent('Look Up Pass')+'&input=text&text='+encodeURIComponent(u)}
const sessOn=app=>st.session&&st.session.until>Date.now()&&(!app||st.session.app===app);
function renderSess(){const el=$('sessBar');if(!el)return;if(!sessOn()){el.innerHTML='';return}
 const s=Math.max(0,Math.round((st.session.until-Date.now())/1000)),mm=Math.floor(s/60),ss=String(s%60).padStart(2,'0');
 el.innerHTML=`<div class="sess">${APPS[st.session.app]?appIcon(st.session.app,40):''}<span class="tx"><b>${esc(t('ss_t',appName(st.session.app)))}</b><small>${t('ss_left',mm+':'+ss)}</small></span><button onclick="endSess()">${t('ss_stop')}</button></div>`}

setInterval(()=>{if($('home').classList.contains('on'))renderSess()},1000);

/* strict family time: a commitment you choose ahead of time (not a hard block, so you're never trapped) */
let strictT=null;
function strictArm(m){clearInterval(strictT);const a=$('anyway');a.disabled=false;a.classList.remove('wait');
 if(!(st.strict&&(m==='family'||inRest())))return;let s=30;a.disabled=true;a.classList.add('wait');
 const tick=()=>{a.textContent=s>0?t('strict_wait',s):t('strict_ok',appName(curApp));if(s<=0){a.disabled=false;a.classList.remove('wait');clearInterval(strictT)}s--};tick();strictT=setInterval(tick,1000)}
/* quiet times (Opal-style "rules", but ours: morning, family time, bedtime, and a day of rest for any day of the week) */
st.rest=st.rest||{on:false,sd:6,st:'08:00',ed:6,et:'20:00'};
function inRest(d=new Date()){const R=st.rest;if(!R||!R.on)return false;const w=d.getDay()*1440+d.getHours()*60+d.getMinutes(),s=R.sd*1440+mins(R.st),e=R.ed*1440+mins(R.et);return s<=e?(w>=s&&w<e):(w>=s||w<e)}
const dayName=i=>new Date(2024,8,1+i).toLocaleDateString(LANGS[LANG].loc,{weekday:'short'});
function renderRules(){const T=st.times,m=mode(),R=st.rest;
 const card=(icon,col,title,sub,on,now,act)=>`<button class="rule glass ${on?'':'off'}" onclick="${act}"><span class="ri" style="background:${col}">${ic(icon)}</span><span class="st ${now?'now':''}">${now?t('r_now'):on?t('r_on'):t('r_off')}</span><b>${title}</b><small>${sub}</small></button>`;
 $('rules').innerHTML=card('sun','rgba(255,214,120,.45)',t('r_m'),t('r_until',T.mEnd),true,m==='morning',"edit('ob4')")
  +card('users','rgba(255,170,120,.45)',t('r_f'),`${T.fStart}–${T.fEnd}`,true,m==='family',"edit('ob4')")
  +card('moon','rgba(160,140,220,.45)',t('r_n'),t('r_from',T.nStart),true,m==='night',"edit('ob4')")
  +card('lock','rgba(255,255,255,.3)',t('strict_t'),st.strict?t('strict_on_s'):t('strict_off_s'),!!st.strict,false,'toggleStrict()')
  +card('leaf','rgba(150,210,160,.45)',t('r_r'),R.on?`${dayName(R.sd)} ${R.st} – ${dayName(R.ed)} ${R.et}`:t('rs_hint'),R.on,inRest(),"openRest()")}
function toggleStrict(){st.strict=!st.strict;save();hap();renderRules();toast(st.strict?t('strict_t_on'):t('strict_t_off'))}
function openRest(){const R=st.rest,o=i=>[0,1,2,3,4,5,6].map(d=>`<option value="${d}" ${d===i?'selected':''}>${dayName(d)}</option>`).join('');
 $('rsSd').innerHTML=o(R.sd);$('rsEd').innerHTML=o(R.ed);$('rsSt').value=R.st;$('rsEt').value=R.et;$('rsBtn').textContent=R.on?t('rs_save'):t('rs_on');$('rsOff').style.display=R.on?'':'none';$('rsSheet').classList.add('on')}
function saveRest(on){st.rest={on,sd:+$('rsSd').value,st:$('rsSt').value||'08:00',ed:+$('rsEd').value,et:$('rsEt').value||'20:00'};save();closeSheet();hap();renderRules();toast(on?t('rs_saved'):t('rs_offed'))}

/* ---------- v39: moments (every "Not now" is a moment with the person you saw), milestones, new settings ---------- */
const MILES=[5,10,25,50,100,250,500];
const nextMile=n=>MILES.find(m=>m>n)||n+100;
function momCount(pid,since=0){return st.log.filter(e=>e.k==='here'&&e.t>=since&&(pid===undefined?true:pid===null?!e.p:e.p===pid)).length}
const weekStart=()=>Date.now()-7*864e5;
function renderMoments(){const el=$('moms');if(!el)return;const wk=weekStart(),all=momCount(undefined,wk);
 const ppl=st.people.map(p=>({p,w:momCount(p.id,wk),tot:momCount(p.id)})).sort((a,b)=>b.w-a.w),self=momCount(null,wk);
 let h=`<div class="mhero glass"><small>${t('m_title')}</small><div class="num">${all}</div><span>${all?t('m_week'):t('m_empty')}</span></div>`;
 h+=ppl.map(({p,w,tot})=>{const nx=nextMile(tot),prev=[0,...MILES].filter(m=>m<=tot).pop()||0,f=(tot-prev)/(nx-prev);
  return`<div class="mrow solid"><i class="mmp" data-pic="${p.pics[0]||''}"></i><span class="tx"><b>${esc(p.name)}</b><small>${t('m_tot',tot)}</small><span class="mbar"><b style="width:${Math.round(f*100)}%"></b></span><small class="nx">${t('m_next',nx-tot,nx)}</small></span><span class="mw"><b>${w}</b><small>${t('m_wk')}</small></span></div>`}).join('');
 if(self)h+=`<div class="mrow glass"><i class="mmp self">${ic('leaf')}</i><span class="tx"><b>${t('m_self')}</b><small>${t('m_self_s')}</small></span><span class="mw"><b>${self}</b><small>${t('m_wk')}</small></span></div>`;
 el.innerHTML=h;el.querySelectorAll('.mmp[data-pic]').forEach(i=>{if(i.dataset.pic)photo(i.dataset.pic).then(s=>{if(s)i.style.backgroundImage=`url(${s})`})})}
/* the "Done" screen: show who the moment was for, and count it */
async function doneMoment(){const p=st.people.find(x=>x.id===curPerson),box=$('dPh');if(!box)return;box.style.display='none';$('dMom').textContent='';
 if(!p)return;const s=await photo(pickPic(p));if(s){box.style.backgroundImage=`url(${s})`;box.style.display=''}
 if(isTest)return;const tot=momCount(p.id),w=momCount(p.id,weekStart());$('dMom').textContent=MILES.includes(tot)?t('m_mile',tot,p.name):t('m_n',w,p.name)}
const pickPic=p=>p.pics[0];
/* settings rows */
function stog(icon,col,title,sub,on,act){return`<button class="srow" onclick="${act}"><span class="ic" style="background:${col}">${ic(icon)}</span><span class="tx"><b>${title}</b><small>${esc(sub)}</small></span><span class="sw ${on?'on':''}"><i></i></span></button>`}
function cycleBreaths(){st.breaths=((st.breaths||1)%3)+1;save();hap();renderSettings()}
function cycleOpen(){const L=[1,2,3,5,10,15],i=L.indexOf(st.lastMin||5);st.lastMin=L[(i+1)%L.length];save();hap();renderSettings()}

/* ---------- apps: summary card + Apple-style picker ---------- */
function selApps(){st.block=st.block||{cats:['social','ent'],apps:[]};return st.block}
const coveredApps=B=>Object.keys(APPS).filter(k=>B.apps.includes(k)||B.cats.includes(APPS[k].c));
function selCardHTML(B,title){const n=B.cats.length+B.apps.length;const cov=coveredApps(B),max=10;
 /* show the real app icons that will be paused (what users recognise), plus the categories as labelled chips */
 return n?`<span class="tx"><b>${title}</b><small>${t('a_sum',B.cats.length,B.apps.length,cov.length)}</small>
  ${B.cats.length?`<span class="catchips">${B.cats.map(k=>`<span>${catIcon(k,26)}${catL(k)}</span>`).join('')}</span>`:''}
  <span class="covgrid">${cov.slice(0,max).map(k=>appIcon(k,38)).join('')}${cov.length>max?`<span class="aic" style="width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.25);font-size:13px;font-weight:700">+${cov.length-max}</span>`:''}</span></span><span style="color:var(--w90)">${ic('chev')}</span>`
  :`<span style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center">${ic('plus')}</span><span class="tx"><b>${t('a_choose')}</b><small>${t('a_choose_s')}</small></span>`}
const PRESETS={social:{cats:['social'],apps:[]},video:{cats:['ent'],apps:['instagram','tiktok']},all:{cats:['social','ent','games','shop'],apps:[]}};
function renderApps(){const B=selApps();$('selCard').innerHTML=selCardHTML(B,t('a_choose'));
 const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
 document.querySelectorAll('#apps .presets button').forEach(b=>{const k=(b.getAttribute('onclick').match(/'(\w+)'/)||[])[1],P=PRESETS[k];b.classList.toggle('on',!!P&&same(P.cats,B.cats)&&same(P.apps,B.apps))});
 const btn=$('appsBtn');btn.disabled=!(B.cats.length||B.apps.length);btn.textContent=editing?t('save'):t('cont')}
function preset(p){const B=selApps();const P=PRESETS[p];B.cats=[...P.cats];B.apps=[...P.apps];save();renderApps();toast(t('pk_sel',B.cats.length+B.apps.length))}
function appsDone(){if(editing)return doneEditing();go('ob2')}
let pk=null,pkOpen={};
function openPicker(){const B=selApps();pk={cats:[...B.cats],apps:[...B.apps]};pkOpen={};$('pkQ').value='';renderPk();$('pkSheet').classList.add('on');$('pkSheet').firstElementChild.scrollTop=0}
function pkRow(k,isCat,sub){if(isCat){const on=pk.cats.includes(k),n=Object.keys(APPS).filter(a=>APPS[a].c===k).length;
  return`<div class="pkr ${on?'on':''}" onclick="pkTogCat('${k}')"><span class="pkc">${ic('check')}</span>${catIcon(k,30)}<span class="tx">${catL(k)}<small>${t('ACAT')[k][1]}</small></span><button class="pkx ${pkOpen[k]?'open':''}" onclick="event.stopPropagation();pkOpen['${k}']=!pkOpen['${k}'];renderPk()" aria-label="expand">${ic('down')}</button></div>`}
 const via=pk.cats.includes(APPS[k].c),on=pk.apps.includes(k);
 return`<div class="pkr ${sub?'sub':''} ${on?'on':''} ${via?'via':''}" onclick="pkTogApp('${k}')"><span class="pkc">${ic('check')}</span>${appIcon(k,30)}<span class="tx">${appName(k)}</span></div>`}
function renderPk(){const q=$('pkQ').value.trim().toLowerCase();$('pkCount').textContent=t('pk_sel',pk.cats.length+pk.apps.length);
 if(q){const ks=Object.keys(APPS).filter(k=>APPS[k].n.toLowerCase().includes(q)||APPS[k].en.toLowerCase().includes(q));
  $('pkList').innerHTML=ks.length?`<div class="pksec">${t('pk_apps')}</div><div class="pkg">${ks.map(k=>pkRow(k)).join('')}</div>`:`<p class="pkf" style="margin:20px 0">${t('pk_none')}</p>`;return}
 $('pkList').innerHTML=`<div class="pksec">${t('pk_cats')}</div><div class="pkg">`+ACATS.map(c=>pkRow(c.k,1)+(pkOpen[c.k]?Object.keys(APPS).filter(a=>APPS[a].c===c.k).map(a=>pkRow(a,0,1)).join(''):'')).join('')+`</div>`}
function pkTogCat(k){pk.cats=pk.cats.includes(k)?pk.cats.filter(x=>x!==k):[...pk.cats,k];if(pk.cats.includes(k))pk.apps=pk.apps.filter(a=>APPS[a].c!==k);renderPk()}
function pkTogApp(k){if(pk.cats.includes(APPS[k].c)){toast(t('pk_incat',appName(k),catL(APPS[k].c)));return}pk.apps=pk.apps.includes(k)?pk.apps.filter(x=>x!==k):[...pk.apps,k];renderPk()}

/* ---------- today ---------- */
const dayKey=d=>d.toDateString();
function countDay(d){const k=dayKey(d),r={here:0,open:0};st.log.forEach(e=>{if(dayKey(new Date(e.t))===k)r[e.k]++});return r}
function streakDays(){let s=0;const d=new Date();if(!countDay(d).here)d.setDate(d.getDate()-1);while(countDay(d).here){s++;d.setDate(d.getDate()-1)}return s}
function drawGauge(v){const cx=150,cy=145,R=120,L=!isRTL();let x='';const ang=f=>Math.PI*(L?1-f:f);
 for(let i=0;i<=40;i++){const a=ang(i/40),long=i%5===0,r1=R-(long?14:8);
  x+=`<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy-r1*Math.sin(a)).toFixed(1)}" x2="${(cx+R*Math.cos(a)).toFixed(1)}" y2="${(cy-R*Math.sin(a)).toFixed(1)}" stroke="${i/40<=v?'#fff':'rgba(255,255,255,.35)'}" stroke-width="${long?2:1.4}" stroke-linecap="round"/>`}
 const a=ang(Math.min(1,v)),R2=R-26;x+=`<path d="M${cx-R2} ${cy} A${R2} ${R2} 0 0 1 ${cx+R2} ${cy}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="3 6"/>`;
 x+=`<circle cx="${(cx+R2*Math.cos(a)).toFixed(1)}" cy="${(cy-R2*Math.sin(a)).toFixed(1)}" r="6" fill="#fff"/>`;$('gauge').innerHTML=x}
/* v35: Cal AI-style week strip on Home: this week's days, a ring fills with the pauses you took that day */
function renderWeekStrip(now){const s=new Date(now);s.setHours(0,0,0,0);s.setDate(s.getDate()-s.getDay());let h='';
 for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const fut=d>now&&dayKey(d)!==dayKey(now),today=dayKey(d)===dayKey(now),n=fut?0:countDay(d).here,f=Math.min(1,n/GOAL),C=94.2;
  h+=`<div class="wd ${today?'today':''} ${fut?'fut':''} ${n?'has':''}"><span class="wl">${d.toLocaleDateString(LANGS[LANG].loc,{weekday:'narrow'})}</span><span class="wc"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="bg"/><circle cx="18" cy="18" r="15" class="fg" style="stroke-dasharray:${(C*f).toFixed(1)} ${C}"/></svg><b>${d.getDate()}</b></span></div>`}
 $('wStrip').innerHTML=h}
function renderHome(){const now=new Date();
 $('hDate').textContent=now.toLocaleDateString(LANGS[LANG].loc,{weekday:'long',day:'numeric',month:'numeric'});
 const today=countDay(now).here;$('tHere').innerHTML=`${today}<small>${t('times',today)}</small>`;drawGauge(today/GOAL);
 $('streak').innerHTML=`${ic('flame')}<b>${streakDays()}</b>`;renderWeekStrip(now);
 /* prototype: the Shortcuts automation (test mode) counts as connected, same as Screen Time access in the App Store build */
 const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 $('connectStatus').innerHTML=(st.perm||st.connected)?(st.connected&&standalone?`<p class="foot" style="margin-top:10px">${t('g_safari_short')}</p>`:''):`<div class="status"><span class="tx"><b>${t('nc_t')}</b><small>${t('nc_s')}</small></span><button class="go" onclick="go('perm')">${t('nc_go')}</button></div>`;
 const wk=st.log.filter(e=>e.t>now-7*864e5);$('wHere').textContent=wk.filter(e=>e.k==='here').length;$('wOpen').textContent=wk.filter(e=>e.k==='open').length;
 $('homeApps').innerHTML=selCardHTML(selApps(),t('h_apps'));renderSess();renderRules();$('alertCard').innerHTML=st.alerts?'':`<div class="acard glass"><span class="ai">${ic('bell')}</span><span class="tx"><b>${t('al2_t')}</b><small>${t('al2_s')}</small></span><button onclick="st.alerts=true;save();hap();renderHome();toast(t('al2_ok'))">${t('al2_go')}</button></div>`}

/* ---------- progress ---------- */
function renderStats(){renderMoments();const now=new Date(),s=streakDays();$('sStreak').textContent=s;
 $('sMiles').innerHTML=[3,7,14,30].map(n=>`<div class="${s>=n?'ok':''}"><i>${s>=n?ic('check'):n}</i>${t('mile',n)}</div>`).join('');
 const wk=st.log.filter(e=>e.t>now-7*864e5),here=wk.filter(e=>e.k==='here').length,tot=wk.length;
 $('sMin').innerHTML=`${here*5}<small>${t('min')}</small>`;$('sRate').textContent=tot?Math.round(here/tot*100)+'%':'–';
 const days=[...Array(7)].map((_,i)=>{const d=new Date(now);d.setDate(now.getDate()-6+i);return{d,c:countDay(d)}});const max=Math.max(1,...days.map(x=>x.c.here));
 $('week').innerHTML=days.map((x,i)=>`<div class="${i===6?'today':''}"><em>${x.c.here||''}</em><i style="--h:${x.c.here/max*100}%"></i><span>${i===6?t('tab_today'):x.d.toLocaleDateString(LANGS[LANG].loc,{weekday:'short'}).replace('יום ','')}</span></div>`).join('');
 $('pplWrap').style.display=st.people.length?'':'none';
 const counts=st.people.map(p=>wk.filter(e=>e.k==='here'&&e.p===p.id).length);const pmax=Math.max(1,...counts);
 $('pplStats').innerHTML=st.people.map((p,i)=>`<div class="rowg"><span class="tx"><b style="display:flex;justify-content:space-between"><span>${esc(p.name)}</span><span>${counts[i]}</span></b><div class="bar"><b style="--w:${counts[i]/pmax*100}%"></b></div></span></div>`).join('')}

/* ---------- connect guide ---------- */
function guideApps(){const ks=coveredApps(selApps());return ks.length?ks:['instagram','tiktok']}
function renderGuide(){const base=location.origin+location.pathname;const u=a=>`${base}#pause&app=${a}`;
 $('ob5later').textContent=st.setup?t('back'):t('later');
 setTimeout(guideChecks,0);
 $('guideCard').innerHTML=t('guide',guideApps().map(k=>`<div class="gapp">${appIcon(k,36)}<b>${appName(k)}</b><button class="copy" style="margin-inline-start:auto" onclick="cp('${u(k)}')">${ic('link')}${t('copy')}</button></div>`).join(''))
  +`<div class="step"><span class="k">5</span><div><p>${t('g_safari')}</p></div></div>`}
/* tap a step number to tick it off; progress is remembered */
function guideChecks(){st.gd=st.gd||[];const steps=[...document.querySelectorAll('#guideCard .step')];
 const upd=()=>{steps.forEach((s,i)=>{s.classList.toggle('done',!!st.gd[i]);s.querySelector('.k').innerHTML=st.gd[i]?ic('check'):i+1});let g=$('gprog');if(!g){g=document.createElement('p');g.id='gprog';g.className='gprog';$('guideCard').after(g)}g.textContent=t('g_prog',st.gd.filter(Boolean).length,steps.length)};
 steps.forEach((s,i)=>s.querySelector('.k').onclick=()=>{st.gd[i]=!st.gd[i];save();upd()});upd()}
function cp(x){(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast(t('t_copied'))).catch(()=>toast(t('t_copyfail')))}

/* ---------- settings ---------- */
function srow(icon,col,title,sub,act){return`<button class="srow" onclick="${act}"><span class="ic" style="background:${col}">${ic(icon)}</span><span class="tx"><b>${title}</b><small>${esc(sub)}</small></span><span class="end">${ic('chev')}</span></button>`}
function renderSettings(){const T=st.times,B=selApps(),n=st.people.length;
 $('setPeople').innerHTML=`<span class="avs" id="setAvs"></span>${n?'':`<span class="addp">${ic('plus')}</span>`}<span class="tx"><b>${t('set_people')}</b><small>${esc(n?st.people.map(p=>p.name).join(', '):t('set_people_s',0))}</small></span><span style="color:#B3A396">${ic('chev')}</span>`;avatars('setAvs');
 $('setList1').innerHTML=srow('phone','#D9652A',t('set_apps'),[...B.cats.map(catL),...B.apps.map(appName)].join(', ')||t('none_yet'),'openPicker()')
  +srow('bulb','#C9A227',t('set_ideas2'),t('set_ideas2_s',st.cats.length+st.custom.length),"edit('ob3')")
  +srow('moon','#8A6E8C',t('set_quiet'),`${t('r_until',T.mEnd)} · ${T.fStart}–${T.fEnd} · ${t('r_from',T.nStart)}`+(st.rest&&st.rest.on?' · '+t('r_r'):''),"edit('ob4')")
  +srow('clock','#3E8E6A',t('set_perm'),st.connected?t('perm_test'):st.perm?t('perm_on'):t('perm_off'),st.connected?"go('ob5')":"go('perm')");
 $('setListF').innerHTML=srow('leaf','#3E8E6A',t('set_breaths'),t('set_breaths_s',st.breaths||1),'cycleBreaths()')
  +stog('bell','#E0842F',t('set_sound'),t('set_sound_s'),!st.mute,'st.mute=!st.mute;save();hap();renderSettings()')
  +srow('clock','#5E8BD9',t('set_open'),t('set_open_s',st.lastMin||5),'cycleOpen()')
  +stog('lock','#5E4E42',t('strict_t'),t('strict_set_s'),!!st.strict,'st.strict=!st.strict;save();hap();renderSettings()');
 $('setList2').innerHTML=srow('globe','#2F80ED',t('set_lang'),LANGS[LANG].name,'openLang()')
  +srow('play','#D9652A',t('set_replay'),t('set_replay_s'),"qi=0;go('ob1',{anim:'up'})")
  +srow('card','#5E4E42',t('set_plan'),t('plan_s',st.trial&&st.trial.plan),"toast(t('t_restore'))")
  +srow('link','#8E8E93',t('set_test'),(st.connected?t('conn_y'):t('conn_n'))+' · '+t('set_test_s'),"go('ob5')");
 $('setList3').innerHTML=srow('lock','#5E4E42',t('set_priv'),t('set_priv_s'),"toast(t('t_priv'))")}
async function resetAll(){if(!confirm(t('reset_q')))return;await DB.clear();const l=st.lang;localStorage.removeItem('lu');if(l)S.set({lang:l});location.hash='';location.reload()}

/* ---------- boot ---------- */
/* test phase: a home-screen web app can't share data with Safari (where the Shortcuts pause opens),
   so when Look Up is launched from the icon, hand over to Safari right away (x-safari-https opens real Safari on iOS) */
function toSafari(){if(!(navigator.standalone||matchMedia('(display-mode: standalone)').matches))return false;
 if(!/iPhone|iPad|iPod/.test(navigator.userAgent))return false;
 location.href='x-safari-'+location.origin+location.pathname;
 setTimeout(()=>{document.body.insertAdjacentHTML('beforeend',`<div style="position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:#A15F40;color:#fff;font:500 17px/1.5 Heebo,sans-serif"><b style="font-size:22px">Look Up</b><span>${t('g_safari_short')}</span><a href="${location.origin+location.pathname}" target="_blank" style="background:#fff;color:#231A14;padding:14px 22px;border-radius:16px;text-decoration:none;font-weight:600">Safari</a></div>`)},1500);return true}
function boot(){applyLang();/* v29: no more auto-handover to Safari (it showed a confusing "Test mode" screen); test Shortcuts from Safari instead */const h=location.hash.slice(1),q=new URLSearchParams(h.replace(/^pause&?/,''));
 if(h.startsWith('pause')){const app=q.get('app')||'instagram';history.replaceState(null,'',location.pathname);
  if(!st.setup){pendingApp=app;go('ob1',{anim:'none'});return}st.connected=true;save();if(sessOn(app)){openApp(app);return}startPause(app,false,'none');return}
 go(st.setup?'home':'ob1',{anim:'none'})}
/* the Shortcuts automation opens ROOT#pause&app=… ; if Look Up is already open in the background iOS may only change the hash, so listen for it */
addEventListener('hashchange',()=>{if(location.hash.startsWith('#pause'))boot()});
addEventListener('pageshow',e=>{if(e.persisted&&location.hash.startsWith('#pause'))boot()});
/* real screen height (fixes the strip under the app on iPhone home-screen apps) */
/* iOS home-screen apps can get a viewport shorter than the screen (the strip at the bottom can't be drawn into).
   So: lay out inside the real viewport, drop the extra bottom padding there, and paint the strip in the matching colour. */
function fitH(){const gap=screen.height-innerHeight,sa=(navigator.standalone||matchMedia('(display-mode: standalone)').matches)&&gap>16&&gap<140;
 document.documentElement.classList.toggle('shortvp',sa);document.documentElement.style.setProperty('--H',innerHeight+'px')}
fitH();addEventListener('resize',fitH);addEventListener('orientationchange',()=>setTimeout(fitH,300));
boot();
if('serviceWorker' in navigator&&!location.pathname.includes('/lookup')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
